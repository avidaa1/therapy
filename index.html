// DOUBLE SLIT EXPERIMENT
// ============================================================
let dsMode='wave',dsDetector=false,dsPhotons=[],dsPattern=[],dsAge=0;
function initDoubleSlit(){dsPhotons=[];dsPattern=new Array(Math.floor(H)).fill(0);dsAge=0;renderDSExtra()}
function renderDSExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  ['wave','particle'].forEach(m=>{
    const b=document.createElement('button');b.className='xb';b.textContent=m.toUpperCase();
    b.style.color=dsMode===m?'#00ccff':'rgba(255,255,255,0.4)';
    b.onclick=()=>{dsMode=m;dsPattern=new Array(Math.floor(H)).fill(0);dsPhotons=[];renderDSExtra()};
    row.appendChild(b);
  });
  const det=document.createElement('button');det.className='xb';
  det.textContent=dsDetector?'DETECTOR: ON':'DETECTOR: OFF';
  det.style.color=dsDetector?'#ff4444':'#00ff88';det.style.borderColor=dsDetector?'#ff444488':'#00ff8888';
  det.onclick=()=>{dsDetector=!dsDetector;dsPattern=new Array(Math.floor(H)).fill(0);dsPhotons=[];renderDSExtra()};
  row.appendChild(det);
}
function drawDoubleSlit(){
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(0,0,W,H);
  dsAge++;
  const slitX=W*.35,screenX=W*.75,slitGap=40,slitW=8,wallH=H;
  // Wall
  ctx.fillStyle='rgba(60,60,100,0.9)';ctx.fillRect(slitX-4,0,8,H/2-slitGap-slitW/2);ctx.fillRect(slitX-4,H/2-slitGap+slitW/2,8,slitGap*2-slitW);ctx.fillRect(slitX-4,H/2+slitGap+slitW/2,8,H/2-slitGap-slitW/2);
  ctx.strokeStyle='rgba(100,120,255,0.6)';ctx.lineWidth=1;ctx.strokeRect(slitX-4,0,8,H);
  // Screen
  ctx.fillStyle='rgba(30,30,60,0.8)';ctx.fillRect(screenX,0,8,H);
  ctx.strokeStyle='rgba(80,80,200,0.5)';ctx.lineWidth=1;ctx.strokeRect(screenX,0,8,H);
  // Source
  if(dsAge%8===0){
    const y0=H/2;
    if(dsMode==='particle'||dsDetector){
      // Single particle — goes through one slit
      const slit=(Math.random()<0.5)?H/2-slitGap:H/2+slitGap;
      dsPhotons.push({x:40,y:y0,tx:slitX,ty:slit,phase:0,slit});
    } else {
      // Wave — both slits
      dsPhotons.push({x:40,y:y0,tx:slitX,ty:H/2-slitGap,phase:0,slit:0,wave:true});
    }
  }
  // Move photons
  for(let i=dsPhotons.length-1;i>=0;i--){
    const p=dsPhotons[i];
    p.phase+=0.08;
    const progress=p.phase/Math.PI;
    if(p.phase<Math.PI){
      p.x=40+(slitX-40)*progress;p.y=p.y+(p.ty-p.y)*0.05;
      ctx.save();ctx.globalAlpha=0.8;ctx.fillStyle='#ffff88';ctx.shadowColor='#ffff00';ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
    } else if(p.phase<Math.PI*2) {
      // After slit — diffract
      const t=(p.phase-Math.PI)/Math.PI;
      if(p.wave&&!dsDetector){
        // Two-slit wave — show both paths
        [H/2-slitGap,H/2+slitGap].forEach(sy=>{
          const ex=slitX+(screenX-slitX)*t,ey=sy+(p.y+(Math.random()-0.5)*2-sy)*t*0.3;
          ctx.save();ctx.globalAlpha=0.4;ctx.strokeStyle='rgba(0,200,255,0.4)';ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(slitX,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore();
        });
        p.x=slitX+(screenX-slitX)*t;p.y=H/2;
      } else {
        p.x=slitX+(screenX-slitX)*t;
        p.y+=Math.sin(p.phase*3)*(dsDetector?0:3);
      }
      ctx.save();ctx.globalAlpha=0.8;ctx.fillStyle=dsDetector?'#ff8844':'#44ffcc';ctx.shadowColor=dsDetector?'#ff4400':'#00ffcc';ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
    } else {
      // Hit screen — add to pattern
      let hitY;
      if(!dsDetector&&dsMode==='wave'){
        // Interference — sinusoidal probability
        const dy=(p.y-H/2);const lambda=40;const theta=Math.atan2(dy,screenX-slitX);
        const path1=Math.sqrt(Math.pow(screenX-slitX,2)+Math.pow(p.y-(H/2-slitGap),2));
        const path2=Math.sqrt(Math.pow(screenX-slitX,2)+Math.pow(p.y-(H/2+slitGap),2));
        const phaseDiff=(path1-path2)/lambda*Math.PI*2;
        const intensity=Math.pow(Math.cos(phaseDiff/2),2);
        if(Math.random()<intensity){hitY=Math.floor(p.y)}else{hitY=Math.floor(H/2+(Math.random()-0.5)*H*.6)}
      } else {
        // Particle — Gaussian around one slit
        const sigma=30;hitY=Math.floor(p.slit+sigma*(Math.random()+Math.random()-1)*1.5);
      }
      hitY=Math.max(0,Math.min(H-1,hitY));
      if(dsPattern[hitY]!==undefined)dsPattern[hitY]=Math.min(dsPattern[hitY]+1,80);
      dsPhotons.splice(i,1);
      ctx.save();ctx.fillStyle=dsDetector?'#ff6600':'#00ffcc';ctx.shadowColor=dsDetector?'#ff4400':'#00ffcc';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(screenX+4,hitY,2,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }
  // Draw accumulation pattern
  const maxP=Math.max(...dsPattern,1);
  for(let y=0;y<H;y++){
    if(dsPattern[y]>0){
      const a=dsPattern[y]/maxP;
      ctx.fillStyle=dsDetector?`rgba(255,100,0,${a*0.9})`:`rgba(0,220,255,${a*0.9})`;
      ctx.fillRect(screenX+10,y,Math.floor(a*60),1);
    }
  }
  // Labels
  ctx.save();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='9px Courier New';ctx.textAlign='center';
  ctx.fillText('SOURCE',40,H-10);ctx.fillText('BARRIER',slitX,H-10);ctx.fillText('SCREEN',screenX,H-10);
  ctx.font='bold 11px Courier New';ctx.fillStyle=dsDetector?'#ff4444':'#00ccff';
  ctx.fillText(dsDetector?'WHICH-PATH DETECTED':'INTERFERENCE PATTERN',W/2,24);
  ctx.font='10px Courier New';ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText(dsMode.toUpperCase()+' MODE',W/2,42);ctx.restore();
}

function playMeow(){
  const a=getAudio(),t=a.currentTime,g=a.createGain();
  g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  g.connect(a._comp||a.destination);
  const baseF=500+Math.random()*300;
  const o=a.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(baseF,t);
  o.frequency.linearRampToValueAtTime(baseF*1.6,t+0.08);
  o.frequency.exponentialRampToValueAtTime(baseF*.55,t+0.4);
  o.connect(g);o.start(t);o.stop(t+0.52);
}

function playCatEat(){
  const a=getAudio(),t=a.currentTime;
  [0,.06,.12].forEach((dt,i)=>{
    const g=a.createGain();g.gain.setValueAtTime(.2,t+dt);g.gain.exponentialRampToValueAtTime(.001,t+dt+.12);
    g.connect(a._comp||a.destination);
    const o=a.createOscillator();o.type='sine';o.frequency.value=800+i*200;o.connect(g);o.start(t+dt);o.stop(t+dt+.13);
  });

// TOP-DOWN CAT — viewed from above, facing direction of travel
function drawCatTopDown(x,y,angle,state,glow,ability){
  const t=catFrame2;
  const baseSize=Math.min((catPowerLevel||1)*5,25);const sc=(ability==='GIANT'?2.5:ability==='FRENZY'?2+Math.sin(t*.3)*.5:1)*baseSize;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle+Math.PI/2); // rotate so cat faces movement direction
  ctx.scale(sc,sc);

  // Glow aura when laser-charged
  if(glow>0){
    const glowHue=(t*6)%360;
    const gr=Math.min(x,y,W-x,H-y);// safe radius
    if(gr>2){
      const gg=ctx.createRadialGradient(0,0,0,0,0,Math.min(32+glow*8,200));
      gg.addColorStop(0,`hsla(${glowHue},100%,70%,${Math.min(glow*.04,.6)})`);
      gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,Math.min(32+glow*8,200),0,Math.PI*2);ctx.fill();
    }
    if(ability==='SPARKLE'){
      for(let i=0;i<3;i++){
        const sa=Math.random()*Math.PI*2,sr=20+Math.random()*30;
        addP(x+Math.cos(sa)*sr,y+Math.sin(sa)*sr,(Math.random()-.5)*2,(Math.random()-.5)*2,`hsl(${Math.random()*360},100%,70%)`,30,2,.02);
      }
    }
  }

  // Body — top-down oval, tabby stripes
  const bodyCol=glow>0?`hsl(${(t*4)%360},80%,65%)`:'#d4a574';
  const bodyCol2=glow>0?`hsl(${(t*4+60)%360},70%,50%)`:'#c8935a';
  ctx.fillStyle=bodyCol;ctx.shadowColor=glow>0?`hsl(${(t*4)%360},100%,60%)`:'rgba(0,0,0,.3)';ctx.shadowBlur=glow>0?15:5;
  ctx.beginPath();ctx.ellipse(0,0,11,16,0,0,Math.PI*2);ctx.fill();
  // Tabby stripe pattern
  ctx.fillStyle=bodyCol2;ctx.globalAlpha=0.5;
  [-8,-3,3,8].forEach(sy=>{ctx.beginPath();ctx.ellipse(0,sy,7,2,0,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // Head — at the top (forward direction)
  ctx.fillStyle=bodyCol;ctx.shadowBlur=0;
  ctx.beginPath();ctx.ellipse(0,-17,10,10,0,0,Math.PI*2);ctx.fill();
  // Face markings
  ctx.fillStyle=bodyCol2;ctx.globalAlpha=0.4;
  ctx.beginPath();ctx.ellipse(0,-17,6,6,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  // Ears — top-down triangles on sides of head
  [[-8,-22],[8,-22]].forEach(([ex,ey])=>{
    ctx.fillStyle='#c8935a';ctx.beginPath();
    ctx.moveTo(ex,ey);ctx.lineTo(ex-4,ey-7);ctx.lineTo(ex+4,ey-7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffaaaa';ctx.beginPath();
    ctx.moveTo(ex,ey+1);ctx.lineTo(ex-2,ey-4);ctx.lineTo(ex+2,ey-4);ctx.closePath();ctx.fill();
  });

  // Eyes — top-down, dilated when chasing
  catBlink=Math.max(0,catBlink-1);
  const eyeOpen=catBlink<3;
  const dilated=state==='chase'||state==='pounce'||glow>5;
  const eyeCol=glow>10?`hsl(${(t*6)%360},100%,65%)`:'#44cc33';
  [[-4,-17],[4,-17]].forEach(([ex,ey])=>{
    ctx.fillStyle=eyeCol;ctx.shadowColor=glow>0?eyeCol:'transparent';ctx.shadowBlur=glow>0?8:0;
    ctx.beginPath();ctx.ellipse(ex,ey,3,eyeOpen?3:0.5,0,0,Math.PI*2);ctx.fill();
    if(eyeOpen){ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(ex,ey,dilated?2.5:1.2,eyeOpen?2.5:0.5,0,0,Math.PI*2);ctx.fill();}
    ctx.shadowBlur=0;
  });

  // Nose
  ctx.fillStyle='#ff8888';ctx.beginPath();
  ctx.moveTo(0,-13);ctx.lineTo(-2,-11);ctx.lineTo(2,-11);ctx.closePath();ctx.fill();

  // Paws — 4 small circles, animated walking
  const walkCycle=Math.sin(t*.18);
  [[-10,-5,walkCycle*.3],[-10,5,-walkCycle*.3],[10,-5,-walkCycle*.3],[10,5,walkCycle*.3]].forEach(([px,py,phase])=>{
    const pawSize=state==='pounce'?5:3.5;
    ctx.fillStyle=bodyCol;ctx.beginPath();ctx.ellipse(px+Math.sin(t*.2+phase)*2,py,pawSize,pawSize*.8,0,0,Math.PI*2);ctx.fill();
    // Claws
    if(state==='pounce'||state==='chase'){
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=.8;
      for(let c=0;c<3;c++){const ca=(c/3-.33)*Math.PI*.6;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(ca)*6,py+Math.sin(ca)*6);ctx.stroke();}
    }
  });

  // Tail — curls to the side, top-down view
  catTailVel+=((state==='notice'||state==='chase'||state==='pounce'?Math.sin(t*.12)*1.5:Math.sin(t*.025)*.3)-catTailAng)*.08;
  catTailAng+=catTailVel;catTailVel*=0.88;
  const tailCurl=catTailAng*1.2;
  ctx.strokeStyle=bodyCol;ctx.lineWidth=5;ctx.lineCap='round';ctx.shadowBlur=0;
  ctx.beginPath();ctx.moveTo(0,14);
  ctx.bezierCurveTo(12+tailCurl*8,18,16+tailCurl*12,8,8+tailCurl*6,-4);ctx.stroke();
  ctx.lineWidth=3;ctx.strokeStyle=bodyCol2;
  ctx.beginPath();ctx.moveTo(0,14);
  ctx.bezierCurveTo(12+tailCurl*8,18,16+tailCurl*12,8,8+tailCurl*6,-4);ctx.stroke();

  // Ability glow ring
  if(ability){
    const ac=CAT_ABILITIES.find(a=>a.name===ability);
    if(ac){ctx.globalAlpha=0.6+Math.sin(t*.15)*.3;ctx.strokeStyle=ac.col;ctx.lineWidth=2;ctx.shadowColor=ac.col;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,0,18*sc,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
  }
  ctx.restore();
}

function drawCatLaser(){
  ctx.fillStyle='rgba(0,0,8,0.18)';ctx.fillRect(0,0,W,H);
  catFrame2++;
  // Lock laser origin to AVIDAA button every frame
  {const _b=document.getElementById('avidaa-home-btn');if(_b){const _br=_b.getBoundingClientRect();const _cr=tc.getBoundingClientRect();laserOriginX=_br.left+_br.width/2-_cr.left;laserOriginY=_br.top+_br.height/2-_cr.top;}}

  // Laser hue — FAST rainbow shift
  laserHue=(laserHue+laserSpeed)%360;

  // Cat AI
  const ldx=laserX-catX,ldy=laserY-catY;
  const ldist=Math.hypot(ldx,ldy)||1;
  let spd=3.5;
  if(catAbility==='TURBO')spd=18;
  else if(catAbility==='SUPER')spd=14;
  else if(catAbility==='COSMIC'){spd=22;}
  else if(catAbility==='FRENZY')spd=7+Math.random()*4;
  else if(catState==='chase')spd=3+catGlow*.04;

  if(laserOn){
    if(catState==='idle'){
      // Slow wander
      catVx+=Math.sin(catFrame2*.02)*.05;catVy+=Math.cos(catFrame2*.017)*.05;
      catVx*=0.95;catVy*=0.95;catX+=catVx;catY+=catVy;
      catX=Math.max(20,Math.min(W-20,catX));catY=Math.max(20,Math.min(H-20,catY));
      catLookAng=Math.atan2(catVy,catVx);
      if(ldist<W*.6){catState='notice';catNoticeT=30;catMeowTimer=10;playMeow();}
    } else if(catState==='notice'){
      catNoticeT--;catLookAng=Math.atan2(ldy,ldx)-Math.PI/2;
      catVx*=0.92;catVy*=0.92;catX+=catVx;catY+=catVy;
      if(catNoticeT<=0)catState='chase';
    } else if(catState==='chase'){
      const acc=spd*.15;
      catVx+=(ldx/ldist)*acc;catVy+=(ldy/ldist)*acc;
      if(catAbility==='GHOST'){catVx*=0.92;catVy*=0.92;}else{catVx*=0.85;catVy*=0.85;}
      catX+=catVx;catY+=catVy;
      catX=Math.max(15,Math.min(W-15,catX));catY=Math.max(15,Math.min(H-15,catY));
      catLookAng=Math.atan2(ldy,ldx)-Math.PI/2;
      // Caught laser!
      if(ldist<22){
        catState='pounce';catPounceT=35;catGlow=Math.min(catGlow+25,120);catCatches++;catPowerLevel=1+catCatches*.08;
        playCatEat();catBlink=3;
        // Grant ability
        if(catGlow>40&&Math.random()<.35&&!catAbility){
          const ab=CAT_ABILITIES[Math.floor(Math.random()*CAT_ABILITIES.length)];
          catAbility=ab.name;catAbilityT=ab.dur;catAbilityTimer=ab.dur;
          playMeow();renderCatExtra();
        }
        if(catAbility==='FRENZY'){laserX=Math.random()*W;laserY=Math.random()*H;}
      }
    } else if(catState==='pounce'){
      catVx*=0.75;catVy*=0.75;catX+=catVx;catY+=catVy;
      catX=Math.max(15,Math.min(W-15,catX));catY=Math.max(15,Math.min(H-15,catY));
      catPounceT--;if(catPounceT<=0){catState='chase';}
    }
    // Glow decays when not catching
    if(catState!=='pounce')catGlow=Math.max(0,catGlow-.3);
  } else {
    catVx*=0.9;catVy*=0.9;catX+=catVx;catY+=catVy;
    catX=Math.max(15,Math.min(W-15,catX));catY=Math.max(15,Math.min(H-15,catY));
    if(catState!=='idle'){catState='idle';catGroomT=0;catGlow=0;catAbility='';if(Math.random()<.4)playMeow();}
    catGroomT++;catLookAng=Math.sin(catFrame2*.015)*.5;
  }

  // Ability timer
  if(catAbility){
    catAbilityTimer--;
    if(catAbilityTimer<=0){catAbility='';catAbilityTimer=0;renderCatExtra();}
  }

  // Meow timer
  catMeowTimer--;
  if(catMeowTimer<=0&&(catState==='chase'||catState==='pounce')&&Math.random()<.003){
    playMeow();catMeowTimer=90+Math.random()*120;catBlink=4;
  }

  // Cat trail
  if(catState==='chase'||catState==='pounce'){
    catTrail.push({x:catX,y:catY,hue:(laserHue)%360,life:20});
  }
  for(let i=catTrail.length-1;i>=0;i--){
    const tr=catTrail[i];tr.life--;
    if(tr.life<=0){catTrail.splice(i,1);continue;}
    const a=tr.life/20;
    ctx.save();ctx.globalAlpha=a*.5;ctx.fillStyle=`hsl(${tr.hue},100%,70%)`;ctx.shadowColor=`hsl(${tr.hue},100%,60%)`;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(tr.x,tr.y,4*a,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // ── LASER — FAST rainbow tracer ──────────────────────────────────────────
  if(laserOn){
    // Add tracer point
    laserTracer.push({x:laserX,y:laserY,hue:laserHue});
    if(laserTracer.length>60)laserTracer.shift();

    // Draw tracer beam segments — thick neon rainbow line
    if(laserTracer.length>2){
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
      // Outer glow passes
      for(let pass=0;pass<3;pass++){
        const lw=[8,4,2][pass];const op=[0.15,0.3,0.8][pass];
        ctx.lineWidth=lw;
        for(let i=1;i<laserTracer.length;i++){
          const t1=laserTracer[i-1],t2=laserTracer[i];
          const pct=i/laserTracer.length;
          ctx.strokeStyle=`hsla(${t2.hue},100%,65%,${op*pct})`;
          ctx.shadowColor=`hsl(${t2.hue},100%,60%)`;ctx.shadowBlur=pass===2?12:0;
          ctx.beginPath();ctx.moveTo(t1.x,t1.y);ctx.lineTo(t2.x,t2.y);ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Pointer device beam — diagonal line from top-right corner
    // Glow at AVIDAA origin
    if(isFinite(laserOriginX)&&isFinite(laserOriginY)&&laserOriginX>0){
      const _og=ctx.createRadialGradient(laserOriginX,laserOriginY,0,laserOriginX,laserOriginY,16);
      _og.addColorStop(0,'hsla('+laserHue+',100%,90%,0.85)');_og.addColorStop(1,'rgba(0,0,0,0)');
      ctx.save();ctx.fillStyle=_og;ctx.beginPath();ctx.arc(laserOriginX,laserOriginY,16,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.95)';ctx.shadowColor='hsl('+laserHue+',100%,70%)';ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(laserOriginX,laserOriginY,3,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.save();
    for(let s=0;s<4;s++){
      const hue=(laserHue+s*30)%360;
      ctx.strokeStyle=`hsla(${hue},100%,70%,${0.8-s*.15})`;
      ctx.lineWidth=3-s*.5;ctx.shadowColor=`hsl(${hue},100%,65%)`;ctx.shadowBlur=s===0?18:0;
      ctx.beginPath();ctx.moveTo(laserOriginX,laserOriginY);ctx.lineTo(laserX,laserY);ctx.stroke();
    }
    ctx.restore();

    // Laser dot — bright multi-ring
    const safeR=Math.max(2,Math.min(laserX,laserY,W-laserX,H-laserY,40));
    const lg=ctx.createRadialGradient(laserX,laserY,0,laserX,laserY,safeR);
    lg.addColorStop(0,'rgba(255,255,255,1)');
    lg.addColorStop(0.2,`hsl(${laserHue},100%,80%)`);
    lg.addColorStop(0.6,`hsla(${laserHue},100%,60%,0.4)`);
    lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save();ctx.shadowColor=`hsl(${laserHue},100%,70%)`;ctx.shadowBlur=25;
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(laserX,laserY,safeR,0,Math.PI*2);ctx.fill();
    // Core white dot
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.arc(laserX,laserY,4,0,Math.PI*2);ctx.fill();
    // Speed rings
    for(let r=0;r<3;r++){
      const rr=8+r*6+(catGlow>0?catGlow*.3:0);
      if(rr<2)continue;
      ctx.globalAlpha=(0.6-r*.15)*(catGlow>0?1:0.4);
      ctx.strokeStyle=`hsl(${(laserHue+r*40)%360},100%,70%)`;ctx.lineWidth=1.5;
      ctx.shadowBlur=8;ctx.beginPath();ctx.arc(laserX,laserY,rr,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  }

  // ── DRAW CAT ──────────────────────────────────────────────────────────────
  drawCatTopDown(catX,catY,catLookAng,catState,catGlow,catAbility);

  // State bubbles
  if(catState==='notice'){
    ctx.save();ctx.font='18px Courier New';ctx.textAlign='center';
    ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=12;
    ctx.fillText('!!',catX,catY-34);ctx.restore();
  }
  if(catState==='pounce'&&catGlow>20){
    ctx.save();ctx.font=`bold ${11+Math.floor(catGlow*.1)}px Courier New`;ctx.textAlign='center';
    ctx.fillStyle=`hsl(${(catFrame2*8)%360},100%,70%)`;ctx.shadowColor='#fff';ctx.shadowBlur=15;
    ctx.fillText('NOM!',catX,catY-36);ctx.restore();
  }
  if(catAbility&&catAbilityTimer>catAbilityT-30){
    const ac=CAT_ABILITIES.find(a=>a.name===catAbility);
    ctx.save();ctx.font='bold 13px Courier New';ctx.textAlign='center';
    ctx.fillStyle=ac?.col||'#fff';ctx.shadowColor=ac?.col||'#fff';ctx.shadowBlur=18;
    ctx.fillText(catAbility+'!',catX,catY-50);ctx.restore();
  }
  if(catState==='idle'&&!laserOn){
    ctx.save();ctx.textAlign='center';ctx.font='11px Courier New';
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillText('z z z',catX,catY-28);ctx.restore();
  }

  // Glow meter
  if(catGlow>5||catCatches>0){
    const mw=Math.min(W*.4,160),mx2=catX-mw/2,my2=catY-50;
    ctx.save();ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.roundRect(mx2,my2,mw,6,3);ctx.fill();
    const pct=catGlow/120;
    const barG=ctx.createLinearGradient(mx2,0,mx2+mw,0);
    barG.addColorStop(0,`hsl(${laserHue},100%,60%)`);barG.addColorStop(1,`hsl(${(laserHue+120)%360},100%,70%)`);
    ctx.fillStyle=barG;ctx.shadowColor=`hsl(${laserHue},100%,60%)`;ctx.shadowBlur=8;
    ctx.beginPath();ctx.roundRect(mx2,my2,mw*pct,6,3);ctx.fill();ctx.restore();
  }

  // Instructions
  ctx.save();ctx.textAlign='center';ctx.font='9px Courier New';ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillText('MOVE CURSOR / TOUCH TO CONTROL LASER · CATCH THE CAT ON THE BEAM',W/2,H-10);ctx.restore();
}

function catLaserMove(x,y){if(laserOn){
  if(catAbility==='LASER EAT'){
    // Laser chases cat when this ability is active - reverse!
    const ldx=catX-laserX,ldy=catY-laserY,ld=Math.hypot(ldx,ldy)||1;
    laserX+=ldx/ld*8;laserY+=ldy/ld*8;
  } else {laserX=x;laserY=y;}
}}

let knotNodes=[],knotEdges=[],knotDrag=-1,knotSolved=false,knotTime=0,knotBestTime=999999,knotPlayer=1,knotP1Time=0,knotP2Time=0,knotTimerActive=false,knotStartT=0;
function initKnotGame(){
  knotNodes=[];knotEdges=[];knotSolved=false;knotTime=0;knotTimerActive=false;
  const n=10;
  // Arrange nodes in a circle first, then tangle
for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const r=Math.min(W,H)*.28;knotNodes.push({x:W/2+Math.cos(a)*r*(0.6+Math.random()*.4),y:H/2+Math.sin(a)*r*(0.6+Math.random()*.4),id:i,col:knotPlayer===1?'#00ccff':'#ff44cc'});}
  // Create tangled edges
  knotEdges=[];const pairs=[];
  while(pairs.length<10){
    const a=Math.floor(Math.random()*n),b=Math.floor(Math.random()*n);
    if(a!==b&&!pairs.find(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)))pairs.push([a,b]);
  }
  knotEdges=pairs.map(([a,b])=>({a,b}));
  knotSolved=false;knotTimerActive=true;knotStartT=performance.now();
  renderKnotExtra();
}
function renderKnotExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  const lbl=document.createElement('div');lbl.style.cssText='color:rgba(255,255,255,0.5);font-size:9px;letter-spacing:2px;margin:0 6px';
  lbl.textContent='PLAYER '+knotPlayer+(knotPlayer===1?' (BLUE)':' (PINK)');row.appendChild(lbl);
  const nb=document.createElement('button');nb.className='xb';nb.textContent='NEW KNOT';nb.onclick=initKnotGame;row.appendChild(nb);
}
function knotCross(a1,a2,b1,b2){
  const d=(a2.x-a1.x)*(b2.y-b1.y)-(a2.y-a1.y)*(b2.x-b1.x);if(Math.abs(d)<0.01)return false;
  const t=((b1.x-a1.x)*(b2.y-b1.y)-(b1.y-a1.y)*(b2.x-b1.x))/d;
  const u=((b1.x-a1.x)*(a2.y-a1.y)-(b1.y-a1.y)*(a2.x-a1.x))/d;
  return t>0.01&&t<0.99&&u>0.01&&u<0.99;
}
function countCrossings(){
  let c=0;
  for(let i=0;i<knotEdges.length;i++)for(let j=i+1;j<knotEdges.length;j++){
    const e1=knotEdges[i],e2=knotEdges[j];
    if(e1.a===e2.a||e1.a===e2.b||e1.b===e2.a||e1.b===e2.b)continue;
    if(knotCross(knotNodes[e1.a],knotNodes[e1.b],knotNodes[e2.a],knotNodes[e2.b]))c++;
  }return c;
}
function drawKnotGame(){
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,H);
  if(!knotNodes.length){ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='12px Courier New';ctx.fillText('PRESS NEW KNOT TO START',W/2,H/2);ctx.restore();return;}
  const crossings=countCrossings();
  // Edges
  knotEdges.forEach(e=>{
    const a=knotNodes[e.a],b=knotNodes[e.b];
    // Check if this edge crosses any other
    let crossed=false;for(let i=0;i<knotEdges.length;i++){const e2=knotEdges[i];if(e===e2)continue;if(e.a===e2.a||e.a===e2.b||e.b===e2.a||e.b===e2.b)continue;if(knotCross(a,b,knotNodes[e2.a],knotNodes[e2.b])){crossed=true;break;}}
    ctx.save();ctx.strokeStyle=crossed?'#ff4444':'#00ff88';ctx.lineWidth=2.5;ctx.shadowColor=crossed?'#ff4444':'#00ff88';ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();
  });
  // Nodes
  knotNodes.forEach((n,i)=>{
    const col=knotPlayer===1?'#00ccff':'#ff44cc';
    ctx.save();ctx.fillStyle=i===knotDrag?'#ffffff':col;ctx.shadowColor=col;ctx.shadowBlur=i===knotDrag?20:8;
    ctx.beginPath();ctx.arc(n.x,n.y,i===knotDrag?18:14,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  // HUD
  if(knotTimerActive){knotTime=(performance.now()-knotStartT)/1000;}
  ctx.save();ctx.font='bold 14px Courier New';ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=8;
  ctx.fillText('CROSSINGS: '+crossings,12,30);
  ctx.font='11px Courier New';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.shadowBlur=0;
  ctx.fillText('TIME: '+knotTime.toFixed(1)+'s',12,50);
  ctx.fillText('P1: '+(knotP1Time?knotP1Time.toFixed(1)+'s':'--')+'  P2: '+(knotP2Time?knotP2Time.toFixed(1)+'s':'--'),12,68);
  ctx.restore();
  // Solved!
  if(crossings===0&&!knotSolved&&knotNodes.length>0){
    knotSolved=true;knotTimerActive=false;
    if(knotPlayer===1)knotP1Time=knotTime;else knotP2Time=knotTime;
    playNote(880,1.5,.2);setTimeout(()=>playNote(1046,1,.2),200);
  }
  if(knotSolved){
    ctx.save();ctx.textAlign='center';ctx.font='bold 22px Courier New';ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';ctx.shadowBlur=25;
    ctx.fillText('UNTANGLED! Player '+knotPlayer,W/2,H/2-15);
    ctx.font='13px Courier New';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.shadowBlur=0;
    ctx.fillText(knotTime.toFixed(2)+'s  |  Tap for next player',W/2,H/2+15);ctx.restore();
  }
}
function knotDown(x,y){
  if(knotSolved){knotPlayer=knotPlayer===1?2:1;initKnotGame();return;}
  let best=-1,bd=9999;
  knotNodes.forEach((n,i)=>{const d=Math.hypot(x-n.x,y-n.y);if(d<50&&d<bd){bd=d;best=i;}});
  knotDrag=best;
}
function knotMove(x,y){if(knotDrag>=0){knotNodes[knotDrag].x=Math.max(30,Math.min(W-30,x));knotNodes[knotDrag].y=Math.max(80,Math.min(H-70,y));}}
function knotUp(){knotDrag=-1;}

let bingoCards=[],bingoCalled=[],bingoPool=[],bingoAuto=null,bingoWinner=-1,bingoDelay=2000;
function initBingo(){
  bingoCalled=[];bingoWinner=-1;
  bingoPool=[...Array(75)].map((_,i)=>i+1);
  for(let i=bingoPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bingoPool[i],bingoPool[j]]=[bingoPool[j],bingoPool[i]];}
  bingoCards=[];
  for(let c=0;c<2;c++){
    const card=[];
    const cols=[[1,15],[16,30],[31,45],[46,60],[61,75]];
    cols.forEach(([lo,hi],ci)=>{
      const pool2=[];for(let i=lo;i<=hi;i++)pool2.push(i);
      for(let i=pool2.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool2[i],pool2[j]]=[pool2[j],pool2[i]];}
      for(let r=0;r<5;r++)card.push({col:ci,row:r,num:ci===2&&r===2?'FREE':pool2[r],marked:ci===2&&r===2});
    });
    bingoCards.push(card);
  }
  if(bingoAuto)clearInterval(bingoAuto);
  bingoAuto=setInterval(bingoCallNext,bingoDelay);
  renderBingoOverlay();
}
function bingoCallNext(){
  if(bingoPool.length===0||bingoWinner>=0){clearInterval(bingoAuto);return;}
  const n=bingoPool.shift();bingoCalled.push(n);
  // Mark cards
  bingoCards.forEach((card,ci)=>{
    card.forEach(cell=>{if(cell.num===n)cell.marked=true;});
    if(checkBingo(card)&&bingoWinner<0){bingoWinner=ci;clearInterval(bingoAuto);playNote(880,2,.2);}
  });
  renderBingoOverlay();
}
function checkBingo(card){
  // rows
  for(let r=0;r<5;r++){if([0,1,2,3,4].every(c=>card.find(x=>x.col===c&&x.row===r)?.marked))return true;}
  // cols
  for(let c=0;c<5;c++){if([0,1,2,3,4].every(r=>card.find(x=>x.col===c&&x.row===r)?.marked))return true;}
  // diags
  if([0,1,2,3,4].every(i=>card.find(x=>x.col===i&&x.row===i)?.marked))return true;
  if([0,1,2,3,4].every(i=>card.find(x=>x.col===i&&x.row===4-i)?.marked))return true;
  return false;
}
function bingoCardHTML(card,ci){
  const letters='BINGO';let h='<div style="display:inline-block;margin:8px">';
  h+='<div style="text-align:center;color:#ffdd00;font-size:12px;letter-spacing:3px;margin-bottom:6px;font-family:\'Courier New\',monospace;">PLAYER '+(ci+1)+(bingoWinner===ci?' 🏆 BINGO!':'')+' </div>';
  h+='<table style="border-collapse:collapse;">';
  h+='<tr>'+letters.split('').map(l=>'<th style="width:44px;height:32px;text-align:center;background:#ffdd0022;color:#ffdd00;font-size:13px;font-family:\'Courier New\',monospace;border:1px solid rgba(255,255,255,0.1)">'+l+'</th>').join('')+'</tr>';
  for(let r=0;r<5;r++){
    h+='<tr>';
    for(let c=0;c<5;c++){
      const cell=card.find(x=>x.col===c&&x.row===r);
      const bg=cell.marked?(bingoWinner===ci?'#ffdd00':'#00ff8866'):'rgba(255,255,255,0.04)';
      const fc=cell.marked?(bingoWinner===ci?'#000':'#00ff88'):'rgba(255,255,255,0.7)';
      h+='<td style="width:44px;height:44px;text-align:center;background:'+bg+';color:'+fc+';font-size:12px;font-family:\'Courier New\',monospace;border:1px solid rgba(255,255,255,0.1);font-weight:'+(cell.marked?'bold':'normal')+'">'+cell.num+'</td>';
    }
    h+='</tr>';
  }
  h+='</table></div>';return h;
}
function renderBingoOverlay(){
  const last10=bingoCalled.slice(-10).reverse();
  const lastN=bingoCalled[bingoCalled.length-1];
  const col='#ffdd00';const id='bingoOverlay';
  let html=overlayHeader('AVIDAA BINGO',col,id);
  html+='<div style="padding:12px 16px;">';
  // Current call
  html+='<div style="text-align:center;margin-bottom:14px;">';
  if(lastN){const letter='BINGO'[Math.floor((lastN-1)/15)];html+='<div style="font-size:48px;font-weight:bold;color:#ffdd00;font-family:\'Courier New\',monospace;text-shadow:0 0 30px #ffdd00">'+letter+' '+lastN+'</div>';}

let tn={ball:{x:0,y:0,vx:0,vy:0,r:8},p1:{y:0,score:0,w:12,h:70},p2:{y:0,score:0,w:12,h:70},rally:0,state:'serve',servePlayer:1,winner:0,gameScore:[0,0],sets:[0,0],flash:0};
let tnKeys={};
const TN_W=()=>Math.min(W,600);const TN_H=()=>Math.min(H-100,400);
const TN_X=()=>(W-TN_W())/2;const TN_Y=()=>(H-TN_H())/2+20;
function initTennis(){
  const tw=TN_W(),th=TN_H(),tx=TN_X(),ty=TN_Y();
  tn.p1={y:ty+th/2,score:0,w:12,h:Math.min(70,th*.18)};
  tn.p2={y:ty+th/2,score:0,w:12,h:Math.min(70,th*.18)};
  tn.ball={x:tx+tw/2,y:ty+th/2,vx:0,vy:0,r:8};
  tn.rally=0;tn.state='serve';tn.servePlayer=1;tn.winner=0;tn.flash=0;
  tn.gameScore=[0,0];tn.sets=[0,0];
  renderTennisExtra();
}
function renderTennisExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  const lbl=document.createElement('div');lbl.style.cssText='color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:1.5px;font-family:\'Courier New\',monospace;margin:0 4px';
  lbl.innerHTML='P1: W/S keys &nbsp;|&nbsp; P2: UP/DOWN keys &nbsp;|&nbsp; SPACE = serve';row.appendChild(lbl);
  const nb=document.createElement('button');nb.className='xb';nb.textContent='RESET';nb.onclick=initTennis;row.appendChild(nb);
}
function tnScore(player){
  const pi=player-1;tn.gameScore[pi]++;
  const s=tn.gameScore;
  // Check win (first to 4 with 2 ahead)
  if((s[0]>=4||s[1]>=4)&&Math.abs(s[0]-s[1])>=2){
    tn.sets[pi]++;tn.gameScore=[0,0];tn.flash=60;playNote(880,.5,.2);setTimeout(()=>playNote(1046,.5,.2),150);
    if(tn.sets[pi]>=3){tn.winner=player;}
  }
  tn.state='serve';tn.servePlayer=3-player;// alternate serve
  const tw=TN_W(),th=TN_H(),tx=TN_X(),ty=TN_Y();
  tn.ball.x=tx+tw/2;tn.ball.y=ty+th/2;tn.ball.vx=0;tn.ball.vy=0;
}
function tnServe(){
  if(tn.state!=='serve')return;
  const speed=5;const dir=tn.servePlayer===1?1:-1;
  tn.ball.vx=speed*dir;tn.ball.vy=(Math.random()-.5)*4;
  tn.ball.x=TN_X()+TN_W()/2;tn.ball.y=TN_Y()+TN_H()/2;
  tn.state='play';
  playNote(440,.1,.15);
}
function drawTennis(){
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,H);
  const tw=TN_W(),th=TN_H(),tx=TN_X(),ty=TN_Y();
  if(tn.flash>0)tn.flash--;
  // Court
  ctx.save();
  if(tn.flash>0){ctx.globalAlpha=tn.flash/60*.3;ctx.fillStyle='#ffdd00';ctx.fillRect(tx,ty,tw,th);ctx.globalAlpha=1;}
  ctx.fillStyle='#1a5c2a';ctx.fillRect(tx,ty,tw,th);
  ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;ctx.strokeRect(tx,ty,tw,th);
  // Net
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(tx+tw/2,ty);ctx.lineTo(tx+tw/2,ty+th);ctx.stroke();ctx.setLineDash([]);
  // Center line
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(tx,ty+th/2);ctx.lineTo(tx+tw,ty+th/2);ctx.stroke();ctx.restore();
  // AI for P2 (simple)
  if(tn.state==='play'){
    const speed=3.2;
    if(tn.ball.x>tx+tw/2)tn.p2.y+=(tn.ball.y-tn.p2.y)*0.1*Math.min(1,speed/3);
    // P1 keyboard
    if(tnKeys['w']||tnKeys['W'])tn.p1.y-=5;
    if(tnKeys['s']||tnKeys['S'])tn.p1.y+=5;
    if(tnKeys['ArrowUp'])tn.p2.y-=5;
    if(tnKeys['ArrowDown'])tn.p2.y+=5;
    // Clamp paddles
    tn.p1.y=Math.max(ty+tn.p1.h/2,Math.min(ty+th-tn.p1.h/2,tn.p1.y));
    tn.p2.y=Math.max(ty+tn.p2.h/2,Math.min(ty+th-tn.p2.h/2,tn.p2.y));
    // Ball move
    tn.ball.x+=tn.ball.vx;tn.ball.y+=tn.ball.vy;
    // Wall bounce
    if(tn.ball.y-tn.ball.r<ty){tn.ball.y=ty+tn.ball.r;tn.ball.vy*=-1;}
    if(tn.ball.y+tn.ball.r>ty+th){tn.ball.y=ty+th-tn.ball.r;tn.ball.vy*=-1;}
    // Paddle 1 (left)
    if(tn.ball.x-tn.ball.r<tx+18&&Math.abs(tn.ball.y-tn.p1.y)<tn.p1.h/2+tn.ball.r){
      tn.ball.vx=Math.abs(tn.ball.vx)*1.05;tn.ball.vy+=(tn.ball.y-tn.p1.y)*.08;tn.rally++;playNote(300,.1,.1);
    }
    // Paddle 2 (right)
    if(tn.ball.x+tn.ball.r>tx+tw-18&&Math.abs(tn.ball.y-tn.p2.y)<tn.p2.h/2+tn.ball.r){
      tn.ball.vx=-Math.abs(tn.ball.vx)*1.05;tn.ball.vy+=(tn.ball.y-tn.p2.y)*.08;tn.rally++;playNote(350,.1,.1);
    }
    // Speed cap
    const spd=Math.hypot(tn.ball.vx,tn.ball.vy);if(spd>12){tn.ball.vx=tn.ball.vx/spd*12;tn.ball.vy=tn.ball.vy/spd*12;}
    // Score
    if(tn.ball.x<tx-20)tnScore(2);
    if(tn.ball.x>tx+tw+20)tnScore(1);
  }
  // Draw paddles
  [[tx+8,tn.p1,'#00ccff'],[tx+tw-8-tn.p2.w,tn.p2,'#ff44cc']].forEach(([px,pad,col])=>{
    ctx.save();ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=12;
    ctx.beginPath();ctx.roundRect(px,pad.y-pad.h/2,pad.w,pad.h,4);ctx.fill();ctx.restore();
  });
  // Ball
  ctx.save();ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(tn.ball.x,tn.ball.y,tn.ball.r,0,Math.PI*2);ctx.fill();ctx.restore();
  // Score display
  ctx.save();ctx.textAlign='center';
  const scoreLabels=['0','15','30','40','AD'];
  ctx.font='bold 14px Courier New';ctx.fillStyle='#00ccff';ctx.shadowColor='#00ccff';ctx.shadowBlur=8;
  ctx.fillText('P1: '+scoreLabels[Math.min(tn.gameScore[0],4)],tx+tw*.25,ty-8);
  ctx.fillStyle='#ff44cc';ctx.shadowColor='#ff44cc';
  ctx.fillText('P2: '+scoreLabels[Math.min(tn.gameScore[1],4)],tx+tw*.75,ty-8);
  ctx.font='11px Courier New';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.shadowBlur=0;
  ctx.fillText('Sets '+tn.sets[0]+':'+tn.sets[1]+'  Rally: '+tn.rally,tx+tw/2,ty-8);
  if(tn.state==='serve'){ctx.fillStyle='#ffdd00';ctx.font='12px Courier New';ctx.fillText('PRESS SPACE TO SERVE',tx+tw/2,ty+th/2);}
  if(tn.winner){ctx.font='bold 20px Courier New';ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=25;ctx.fillText('PLAYER '+tn.winner+' WINS!',tx+tw/2,ty+th/2);}
  ctx.restore();
}
// Touch controls for tennis
let tnTouchSide=-1;
function tnTouchMove(x,y){
  const tw=TN_W(),tx=TN_X(),ty=TN_Y(),th=TN_H();
  if(x<tx+tw/2)tn.p1.y=Math.max(ty+tn.p1.h/2,Math.min(ty+th-tn.p1.h/2,y));
  else tn.p2.y=Math.max(ty+tn.p2.h/2,Math.min(ty+th-tn.p2.h/2,y));
}

  const wg=ctx.createLinearGradient(0,wy,0,H);wg.addColorStop(0,'rgba(0,30,80,0.5)');wg.addColorStop(1,'rgba(0,5,30,0.4)');ctx.fillStyle=wg;ctx.fillRect(0,wy,W,H-wy);

    // Glow if attracted

    ctx.restore();

  });

  if(fishHook.cast){
    if(fishHook.depth<H*.5)fishHook.depth+=1.2;

    ctx.strokeStyle='#aaaaaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(fishHook.x,fishHook.y+fishHook.depth+8,6,0,Math.PI*1.5);ctx.stroke();

  }

// SCRABBLE — AI-powered word game
// ============================================================
const SCRABBLE_WORDS=['QUANTUM','GALAXY','NEBULA','COSMOS','AURORA','SIGNAL','RHYTHM','WISDOM','CRYSTAL','PLASMA','PHOTON','ORBIT','COMET','LUNAR','SOLAR','VOID','AURA','NOVA','PULSE','WAVE','FLOW','SYNC','GRID','NODE','ECHO'];
const SCRABBLE_PTS={A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
const SCRABBLE_FREQ={A:9,B:2,C:2,D:4,E:12,F:2,G:3,H:2,I:9,J:1,K:1,L:4,M:2,N:6,O:8,P:2,Q:1,R:6,S:4,T:6,U:4,V:2,W:2,X:1,Y:2,Z:1};
let scrTiles=[],scrBoard=[],scrHand=[],scrScore=0,scrMsg='',scrSelected=-1,scrCurrentWord='',scrPlaced=[];
const SCRAB_SIZE=7;
function initScrabble(){
  scrTiles=[];scrScore=0;scrMsg='';scrSelected=-1;scrCurrentWord='';scrPlaced=[];
  // Build bag
  const bag=[];Object.entries(SCRABBLE_FREQ).forEach(([l,n])=>{for(let i=0;i<n;i++)bag.push(l);});
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  scrBoard=[];for(let i=0;i<SCRAB_SIZE;i++)scrBoard.push({letter:'',col:'',pts:0});
  // Draw 7 tiles for hand
  scrHand=bag.slice(0,7).map(l=>({letter:l,pts:SCRABBLE_PTS[l]||1,id:Math.random()}));
  scrTiles=bag.slice(7);
  renderScrabbleOverlay();
}
function scrWordScore(word){return word.split('').reduce((s,l)=>s+(SCRABBLE_PTS[l]||1),0);}
function scrValidWord(word){
  if(word.length<2)return false;
  const upper=word.toUpperCase();
  return SCRABBLE_WORDS.some(w=>w===upper)||upper.length>=4;// accept any 4+ letter word
}
function scrPlaceTile(tileIdx,boardIdx){
  if(boardIdx>=SCRAB_SIZE||scrBoard[boardIdx].letter)return;
  const tile=scrHand[tileIdx];if(!tile)return;
  scrBoard[boardIdx]={letter:tile.letter,col:tile.col,pts:tile.pts};
  scrPlaced.push({tile,boardIdx,handIdx:tileIdx});
  scrHand.splice(tileIdx,1);
  scrCurrentWord=scrBoard.map(b=>b.letter).join('').replace(/\s/g,'');
  renderScrabbleOverlay();
}
function scrSubmit(){
  const word=scrBoard.map(b=>b.letter).filter(l=>l).join('');
  if(scrValidWord(word)){
    const pts=scrWordScore(word);scrScore+=pts;scrMsg='WORD ACCEPTED! +'+pts+' pts';
    scrBoard=scrBoard.map(()=>({letter:'',pts:0}));scrPlaced=[];scrCurrentWord='';
    // Refill hand
    while(scrHand.length<7&&scrTiles.length>0)scrHand.push({letter:scrTiles.shift(),pts:SCRABBLE_PTS[scrTiles[0]]||1,id:Math.random()});
    playNote(880,.3,.15);setTimeout(()=>playNote(1046,.3,.15),150);
  }else{scrMsg='Not a valid word. Try again!';}
  renderScrabbleOverlay();
}
function scrHint(){
  const letters=scrHand.map(t=>t.letter);

    ctx.save();ctx.textAlign='center';ctx.font='bold 11px Courier New';ctx.fillStyle=memPhase==='watch'?'#ffdd00':'#00ff88';ctx.fillText(memPhase==='watch'?'WATCH THE SEQUENCE':'TAP THE SEQUENCE! ('+memPlayerSeq.length+'/'+memSeq.length+')',W/2,30);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('SCORE: '+vtScore+'  LEVEL: '+memLevel,W/2,H-10);ctx.restore();

    for(let i=0;i<9;i++){const c=i%gsize,r=Math.floor(i/gsize);const bx=startX2+c*(cw2+8),by=startY2+r*(cw2+8);const cell=cogGrid[i];const isOdd=i===cogAnswer;ctx.save();ctx.fillStyle=isOdd&&!cogShowing?cell.col+' ':cell.col+(cogShowing&&i===cogAnswer?'ff':'66');ctx.strokeStyle=cell.col;ctx.lineWidth=2;ctx.shadowColor=i===cogAnswer&&!cogShowing?cell.col:'transparent';ctx.shadowBlur=i===cogAnswer&&!cogShowing?20:0;ctx.beginPath();ctx.roundRect(bx,by,cw2,cw2,6);ctx.fill();ctx.stroke();

function pacCollides(x,y,dir){

// ── SHARED WORD PARTICLES ─────────────────────────────────────────────────────
let wtParticles=[];
function wtAddWord(text,x,y,col,life,sz,vx,vy,fade,glow){
  wtParticles.push({text,x,y,col,life,ml:life,sz,vx,vy,fade,glow,alpha:0,born:0});
}
function wtTickParticles(){
  for(let i=wtParticles.length-1;i>=0;i--){
    const p=wtParticles[i];
    p.born++;p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy*=0.97;p.life--;
    if(p.born<15)p.alpha=p.born/15;
    else if(p.fade&&p.life<40)p.alpha=p.life/40;
    else p.alpha=1;
    if(p.life<=0){wtParticles.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=p.alpha;
    ctx.font=`bold ${p.sz}px 'Courier New',monospace`;
    ctx.textAlign='center';
    if(p.glow){ctx.shadowColor=p.col;ctx.shadowBlur=p.glow;}
    ctx.fillStyle=p.col;
    ctx.fillText(p.text,p.x,p.y);
    ctx.restore();
  }
}

// ── SUB-MODE 3: BREATH WORD ───────────────────────────────────────────────────
const BREATH_WORDS=['RELEASE','TRUST','ENOUGH','PRESENT','SAFE','OPEN','WHOLE','BREATHE','PEACE','GROUND','SOFTEN','ALLOW','RECEIVE','EXPAND','ARRIVE','SETTLE','BELONG','FLOW','REST','LOVE'];
let bwWordIdx=0,bwPhase2='inhale',bwPhaseT=0,bwCycle=0,bwWordT=0,bwRunning=false;
const BW_INHALE=240,BW_HOLD=60,BW_EXHALE=240,BW_PAUSE=60;

function renderBreathWordExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  const tog=document.createElement('button');tog.className='xb';
  tog.textContent=bwRunning?'■ PAUSE':'▶ BEGIN';
  tog.style.cssText=`color:${bwRunning?'#ff4444':'#00ff88'};border-color:${bwRunning?'#ff444466':'#00ff8866'};font-size:12px;padding:8px 20px;`;
  tog.onclick=()=>{bwRunning=!bwRunning;if(bwRunning){bwPhase2='inhale';bwPhaseT=0;}renderBreathWordExtra();};
  row.appendChild(tog);
  const lbl=document.createElement('div');
  lbl.style.cssText='color:rgba(255,255,255,0.25);font-size:9px;letter-spacing:2px;font-family:\'Courier New\',monospace;margin-top:4px;text-align:center;width:100%;';
  lbl.textContent='BREATHE WITH THE WORD · NEW WORD EVERY 4 CYCLES';
  row.appendChild(lbl);
}

function drawBreathWord(){
  ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(0,0,W,H);
  const word=BREATH_WORDS[bwWordIdx%BREATH_WORDS.length];
  if(bwRunning){
    bwPhaseT++;
    // Phase transitions
    const dur={inhale:BW_INHALE,hold:BW_HOLD,exhale:BW_EXHALE,pause:BW_PAUSE}[bwPhase2];
    if(bwPhaseT>=dur){
      bwPhaseT=0;
      if(bwPhase2==='inhale')bwPhase2='hold';
      else if(bwPhase2==='hold')bwPhase2='exhale';
      else if(bwPhase2==='exhale'){bwPhase2='pause';bwCycle++;}
      else{bwPhase2='inhale';bwWordT++;if(bwWordT>=4){bwWordT=0;bwWordIdx++;playNote(528,1,.08);}}
    }
  }
  // Sizing: inhale grows, exhale shrinks
  let scale=1;const t=bwPhaseT;
  if(bwPhase2==='inhale')scale=0.5+0.5*(t/BW_INHALE);
  else if(bwPhase2==='hold')scale=1;
  else if(bwPhase2==='exhale')scale=1-0.5*(t/BW_EXHALE);
  else scale=0.5;
  // Color shifts with phase
  const cols={inhale:'#00ccff',hold:'#00ff88',exhale:'#cc44ff',pause:'#4444ff'};
  const col=cols[bwPhase2]||'#00ccff';
  // Glow circle
  const r=Math.min(W,H)*(0.12+scale*0.18);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,r);
  g.addColorStop(0,col+'33');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Ring
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.shadowColor=col;ctx.shadowBlur=20;ctx.globalAlpha=0.6+scale*.3;
  ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke();ctx.restore();
  // The word
  const fontSize=Math.min(W*.1,42)*scale;
  ctx.save();ctx.textAlign='center';ctx.font=`bold ${Math.max(fontSize,14)}px 'Courier New',monospace`;
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=bwRunning?25:0;
  ctx.globalAlpha=0.5+scale*.5;
  ctx.fillText(word,W/2,H/2+fontSize*.35);ctx.restore();
  // Phase label
  if(bwRunning){
    ctx.save();ctx.textAlign='center';ctx.font=`${Math.min(W*.03,12)}px 'Courier New',monospace`;
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fillText(bwPhase2.toUpperCase(),W/2,H/2+fontSize*.35+30);ctx.restore();
  }
  // Not running
  if(!bwRunning){
    ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.font=`${Math.min(W*.03,12)}px 'Courier New',monospace`;
    ctx.fillText('PRESS BEGIN · BREATHE WITH THE WORD',W/2,H*.75);ctx.restore();
  }
}

// ============================================================
// CONCENTRATION THERAPY — laser beam focus tool for kids
// ============================================================
let ctRunning=false,ctSpeed=2,ctMode='chase',ctAge3=0;
let ctBeams=[],ctTrails=[],ctSoundNodes=[],ctBgHue=0;
let ctSpeedDir=1,ctAutoSpeed=false,ctLastNote=0;

// Speed presets
const CT_SPEEDS={slow:0.8,medium:2,fast:4,random:null};
const CT_MODES={
  chase:'LED Chase',
  spiral:'Spiral',
  bounce:'Bounce',
  rain:'Rain',
  orbit:'Orbit',
  pulse:'Pulse Ring',
  wave:'Sine Wave',
  comet:'Comets',
};

function initConcentration(){
  ctRunning=false;ctAge3=0;ctBeams=[];ctTrails=[];ctSpeedDir=1;ctBgHue=0;ctLastNote=0;
  stopCtSounds();
  // Init beams for each mode
  spawnCtBeams();
  renderCtExtra();
}

function spawnCtBeams(){
  ctBeams=[];ctTrails=[];
  if(ctMode==='chase'){
    // 8 LED dots chasing each other along a path
    for(let i=0;i<8;i++)ctBeams.push({t:i/8,hue:i*45,r:5,alpha:1-(i*.08)});
  } else if(ctMode==='spiral'){
    for(let i=0;i<12;i++)ctBeams.push({ang:i/12*Math.PI*2,r:0,hue:i*30,speed:ctSpeed});
  } else if(ctMode==='bounce'){
    for(let i=0;i<6;i++)ctBeams.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*ctSpeed*4,vy:(Math.random()-.5)*ctSpeed*4,hue:i*60,r:6});
  } else if(ctMode==='rain'){
    for(let i=0;i<16;i++)ctBeams.push({x:Math.random()*W,y:Math.random()*H-H,hue:i*22,speed:ctSpeed*(1+Math.random()),r:4+Math.random()*4,trail:[]});
  } else if(ctMode==='orbit'){
    for(let i=0;i<12;i++)ctBeams.push({ang:i/12*Math.PI*2,radius:Math.min(W,H)*(0.15+i*.018),hue:i*30,r:4+i*.5,speed:ctSpeed*(0.5+i*.08)});
  } else if(ctMode==='pulse'){
    for(let i=0;i<6;i++)ctBeams.push({r:0,maxR:Math.min(W,H)*.5,hue:i*60,speed:ctSpeed*1.5,alpha:1,phase:i/6*Math.PI*2});
  } else if(ctMode==='wave'){
    for(let i=0;i<5;i++)ctBeams.push({offset:i/5,hue:i*72,amp:Math.min(H*.15,80),phase:i*1.2});
  } else if(ctMode==='comet'){
    for(let i=0;i<5;i++)ctBeams.push({x:Math.random()*W,y:Math.random()*H,ang:Math.random()*Math.PI*2,speed:ctSpeed*3,hue:i*72,trail:[],r:6});
  }
}

// Soft ambient sound engine
function ctPlayTone(hue,intensity){
  const now=performance.now();
  if(now-ctLastNote<80)return;ctLastNote=now;
  const a=getAudio(),t=a.currentTime;
  // Map hue to pentatonic scale freqs
  const pent=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880];
  const fi=Math.floor(hue/36)%pent.length;
  const freq=pent[fi]*(1+Math.floor(hue/360));
  const g=a.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.04*intensity,t+0.04);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.8);
  g.connect(a._rev||a._comp||a.destination);
  const o=a.createOscillator();o.type='sine';o.frequency.value=freq;
  const o2=a.createOscillator();o2.type='sine';o2.frequency.value=freq*1.5;
  const g2=a.createGain();g2.gain.value=0.3;
  o.connect(g);o2.connect(g2);g2.connect(g);
  o.start(t);o2.start(t);o.stop(t+0.85);o2.stop(t+0.85);
}
function stopCtSounds(){ctSoundNodes.forEach(n=>{try{n.stop&&n.stop();n.disconnect&&n.disconnect()}catch(e){}});ctSoundNodes=[];}

function renderCtExtra(){
  const row=document.getElementById('extra');row.innerHTML='';

  // Speed controls
  const speedWrap=document.createElement('div');speedWrap.style.cssText='display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%;align-items:center;';
  const speedLbl=document.createElement('span');speedLbl.style.cssText='color:rgba(0,255,200,0.5);font-size:9px;letter-spacing:2px;font-family:\'Courier New\',monospace;';speedLbl.textContent='SPEED:';speedWrap.appendChild(speedLbl);
  ['SLOW','MED','FAST','AUTO'].forEach((l,i)=>{
    const spds=[0.6,2,4.5,null];const b=document.createElement('button');b.className='xb';b.textContent=l;
    const active=(ctAutoSpeed&&l==='AUTO')||(!ctAutoSpeed&&spds[i]===ctSpeed);
    b.style.cssText=`font-size:9px;padding:4px 8px;min-height:26px;${active?'color:#ffdd00;border-color:#ffdd0066;':''}`;
    b.onclick=()=>{
      if(l==='AUTO'){ctAutoSpeed=true;}else{ctAutoSpeed=false;ctSpeed=spds[i];spawnCtBeams();}
      renderCtExtra();
    };speedWrap.appendChild(b);
  });
  row.appendChild(speedWrap);

  // Mode buttons
  const modeWrap=document.createElement('div');modeWrap.style.cssText='display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%;';
  Object.entries(CT_MODES).forEach(([k,v])=>{

    b.style.cssText=`font-size:9px;padding:4px 8px;min-height:26px;${ctMode===k?'color:#00ffcc;border-color:#00ffcc66;':''}`;
    b.onclick=()=>{ctMode=k;spawnCtBeams();renderCtExtra();};modeWrap.appendChild(b);
  });
  row.appendChild(modeWrap);

  // Play/Stop
  const tog=document.createElement('button');tog.className='xb';
  tog.textContent=ctRunning?'■ PAUSE':'▶ START';
  tog.style.cssText=`font-size:12px;padding:8px 22px;color:${ctRunning?'#ff4444':'#00ff88'};border-color:${ctRunning?'#ff444466':'#00ff8866'};`;
  tog.onclick=()=>{ctRunning=!ctRunning;if(!ctRunning)stopCtSounds();renderCtExtra();};row.appendChild(tog);
}

function drawConcentration(){
  ctAge3++;
  // Dynamic background — very slow hue shift, slightly lit
  ctBgHue=(ctBgHue+0.15)%360;
  const bgAlpha=ctRunning?0.88:0.92;
  ctx.fillStyle=`rgba(2,0,12,${bgAlpha})`;ctx.fillRect(0,0,W,H);
  // Soft ambient glow in bg
  if(ctRunning){
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.6);
    bg.addColorStop(0,`hsla(${ctBgHue},80%,15%,0.08)`);
    bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  }

  if(!ctRunning){
    ctx.save();ctx.textAlign='center';
    ctx.font=`bold ${Math.min(W*.045,18)}px 'Courier New',monospace`;
    ctx.fillStyle='rgba(0,255,200,0.3)';
    ctx.fillText('PRESS START · FOCUS ON THE LIGHT',W/2,H/2-16);
    ctx.font=`${Math.min(W*.032,13)}px 'Courier New',monospace`;
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillText('SOFT SOUNDS · RAINBOW COLORS · BREATHING RHYTHM',W/2,H/2+14);
    ctx.restore();
    return;
  }

  // Auto speed — oscillates slow→fast→slow
  if(ctAutoSpeed){
    ctSpeed=1.2+2.8*(0.5+0.5*Math.sin(ctAge3*.008));
  }

  const sp=ctSpeed;

  if(ctMode==='chase'){
    // LED chase along a rounded rectangle path
    const margin=Math.min(W,H)*.12;
    const pathW=W-margin*2,pathH=H-margin*2;
    const perim=2*(pathW+pathH);
    ctBeams.forEach((b,bi)=>{
      b.t=(b.t+sp*.003)%1;
      const dist=b.t*perim;
      let x,y;
      if(dist<pathW){x=margin+dist;y=margin;}
      else if(dist<pathW+pathH){x=margin+pathW;y=margin+(dist-pathW);}
      else if(dist<2*pathW+pathH){x=margin+pathW-(dist-pathW-pathH);y=margin+pathH;}
      else{x=margin;y=margin+pathH-(dist-2*pathW-pathH);}
      b.hue=(b.hue+sp*.8)%360;
      // Trail
      ctTrails.push({x,y,hue:b.hue,alpha:0.7,r:b.r+2,decay:.04});
      // Glow dot
      ctx.save();
      const g=ctx.createRadialGradient(x,y,0,x,y,b.r*3.5);
      g.addColorStop(0,`hsla(${b.hue},100%,90%,${b.alpha})`);
      g.addColorStop(.4,`hsla(${b.hue},100%,65%,.4)`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.shadowColor=`hsl(${b.hue},100%,70%)`;ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(x,y,b.r*3.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`hsl(${b.hue},100%,95%)`;
      ctx.beginPath();ctx.arc(x,y,b.r*.8,0,Math.PI*2);ctx.fill();
      ctx.restore();
      if(bi===0)ctPlayTone(b.hue,0.6);
    });
  } else if(ctMode==='spiral'){
    ctBeams.forEach((b,bi)=>{
      b.ang+=sp*.018*(1+bi*.02);b.r=(b.r+sp*.4)%(Math.min(W,H)*.52);
      b.hue=(b.hue+sp*.5)%360;
      const x=W/2+Math.cos(b.ang)*b.r,y=H/2+Math.sin(b.ang)*b.r;
      ctTrails.push({x,y,hue:b.hue,alpha:.6,r:5,decay:.03});
      ctx.save();ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=20;
      ctx.fillStyle=`hsl(${b.hue},100%,75%)`;
      ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.restore();
      if(bi===0&&b.r<2)ctPlayTone(b.hue,0.5);
    });
  } else if(ctMode==='bounce'){
    ctBeams.forEach((b,bi)=>{
      b.x+=b.vx*sp*.5;b.y+=b.vy*sp*.5;b.hue=(b.hue+sp*.6)%360;
      if(b.x<b.r||b.x>W-b.r){b.vx*=-1;ctPlayTone(b.hue,0.4);}
      if(b.y<b.r||b.y>H-b.r){b.vy*=-1;ctPlayTone(b.hue,0.4);}
      ctTrails.push({x:b.x,y:b.y,hue:b.hue,alpha:.7,r:b.r+3,decay:.035});
      ctx.save();ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=22;
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.5);
      g.addColorStop(0,`hsl(${b.hue},100%,92%)`);g.addColorStop(1,`hsla(${b.hue},100%,55%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.5,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  } else if(ctMode==='rain'){
    ctBeams.forEach((b,bi)=>{
      b.y+=b.speed*sp;b.hue=(b.hue+sp*.4)%360;
      if(b.y>H+20){b.y=-20;b.x=Math.random()*W;ctPlayTone(b.hue,0.3);}
      b.trail=b.trail||[];b.trail.push({x:b.x,y:b.y});if(b.trail.length>18)b.trail.shift();
      // Draw trail as beam
      if(b.trail.length>1){
        ctx.save();ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=15;
        for(let ti=1;ti<b.trail.length;ti++){
          const a=ti/b.trail.length;
          ctx.strokeStyle=`hsla(${b.hue},100%,70%,${a*.8})`;ctx.lineWidth=b.r*(a*.5+.2);
          ctx.lineCap='round';ctx.beginPath();
          ctx.moveTo(b.trail[ti-1].x,b.trail[ti-1].y);ctx.lineTo(b.trail[ti].x,b.trail[ti].y);ctx.stroke();
        }ctx.restore();
      }
      ctx.save();ctx.shadowColor=`hsl(${b.hue},100%,80%)`;ctx.shadowBlur=20;
      ctx.fillStyle=`hsl(${b.hue},100%,95%)`;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  } else if(ctMode==='orbit'){
    ctBeams.forEach((b,bi)=>{
      b.ang+=b.speed*.018;b.hue=(b.hue+sp*.3)%360;
      const x=W/2+Math.cos(b.ang)*b.radius,y=H/2+Math.sin(b.ang)*b.radius;
      ctTrails.push({x,y,hue:b.hue,alpha:.5,r:b.r+2,decay:.025});
      ctx.save();ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=18;
      ctx.fillStyle=`hsl(${b.hue},100%,85%)`;
      ctx.beginPath();ctx.arc(x,y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
      // Orbit ring faint
      ctx.save();ctx.globalAlpha=0.06;ctx.strokeStyle=`hsl(${b.hue},80%,60%)`;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(W/2,H/2,b.radius,0,Math.PI*2);ctx.stroke();ctx.restore();
      if(bi===0)ctPlayTone(b.hue,0.3);
    });
  } else if(ctMode==='pulse'){
    ctBeams.forEach((b,bi)=>{
      b.r=(b.r+sp*1.2)%b.maxR;b.hue=(b.hue+sp*.4)%360;
      b.alpha=1-b.r/b.maxR;
      ctx.save();ctx.globalAlpha=b.alpha*.7;ctx.strokeStyle=`hsl(${b.hue},100%,70%)`;
      ctx.lineWidth=3-b.r/b.maxR*2;ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=20;
      ctx.beginPath();ctx.arc(W/2,H/2,b.r,0,Math.PI*2);ctx.stroke();ctx.restore();
      if(b.r<sp*1.5)ctPlayTone(b.hue,0.35);
    });
  } else if(ctMode==='wave'){
    ctBeams.forEach((b,bi)=>{
      b.phase+=sp*.04;b.hue=(b.hue+sp*.3)%360;
      ctx.save();ctx.lineWidth=3;ctx.shadowColor=`hsl(${b.hue},100%,65%)`;ctx.shadowBlur=16;
      ctx.strokeStyle=`hsl(${b.hue},100%,72%)`;ctx.beginPath();
      for(let x=0;x<W;x+=4){
        const y=H*(0.3+bi*.08)+Math.sin((x/W)*Math.PI*4+b.phase)*b.amp;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }ctx.stroke();ctx.restore();
      if(bi===0&&Math.floor(b.phase*2)%6===0)ctPlayTone(b.hue,0.25);
    });
  } else if(ctMode==='comet'){
    ctBeams.forEach((b,bi)=>{
      b.x+=Math.cos(b.ang)*b.speed*sp*.5;b.y+=Math.sin(b.ang)*b.speed*sp*.5;
      b.hue=(b.hue+sp*.8)%360;
      b.trail=b.trail||[];b.trail.push({x:b.x,y:b.y,hue:b.hue});if(b.trail.length>30)b.trail.shift();
      if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){
        b.x=Math.random()*W;b.y=Math.random()*H;b.ang=Math.random()*Math.PI*2;
        b.trail=[];ctPlayTone(b.hue,0.4);
      }
      // Comet tail
      if(b.trail.length>2){
        for(let ti=1;ti<b.trail.length;ti++){
          const a=ti/b.trail.length;const tr=b.trail[ti];
          ctx.save();ctx.globalAlpha=a*.6;ctx.strokeStyle=`hsla(${tr.hue},100%,70%,1)`;
          ctx.lineWidth=(1+a*3);ctx.shadowColor=`hsl(${tr.hue},100%,65%)`;ctx.shadowBlur=a*14;
          ctx.lineCap='round';ctx.beginPath();
          ctx.moveTo(b.trail[ti-1].x,b.trail[ti-1].y);ctx.lineTo(tr.x,tr.y);ctx.stroke();ctx.restore();
        }
      }
      // Head
      ctx.save();ctx.shadowColor=`hsl(${b.hue},100%,90%)`;ctx.shadowBlur=25;
      ctx.fillStyle=`hsl(${b.hue},100%,96%)`;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  }

  // Draw + decay shared trails
  for(let i=ctTrails.length-1;i>=0;i--){
    const t=ctTrails[i];t.alpha-=t.decay;t.r*=0.97;
    if(t.alpha<=0){ctTrails.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=t.alpha;
    const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,t.r);
    g.addColorStop(0,`hsl(${t.hue},100%,80%)`);g.addColorStop(1,`hsla(${t.hue},100%,60%,0)`);
    ctx.fillStyle=g;ctx.shadowColor=`hsl(${t.hue},100%,65%)`;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // Speed indicator — subtle rainbow ring at edge
  const ringR=Math.min(W,H)*.46;
  const progress=(ctAge3*sp*.002)%1;
  ctx.save();ctx.lineWidth=2;ctx.globalAlpha=0.18;
  ctx.strokeStyle=`hsl(${(ctAge3*sp*.5)%360},100%,65%)`;
  ctx.beginPath();ctx.arc(W/2,H/2,ringR,0,progress*Math.PI*2);ctx.stroke();ctx.restore();
}

// Safe radial gradient — prevents NaN/Inf crash
function safeRG(x,y,r0,x2,y2,r1){
  if(!isFinite(x)||!isFinite(y)||!isFinite(r0)||!isFinite(x2)||!isFinite(y2)||!isFinite(r1))return null;
  r0=Math.max(0,r0);r1=Math.max(r0+.01,r1);
  try{return ctx.createRadialGradient(x,y,r0,x2,y2,r1);}catch(e){return null;}
}

function playFreqTone(freq,dur,vol,type){
  type=type||'sine';
  const a=getAudio(),t=a.currentTime,g=a.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.12,t+0.08);
  g.gain.exponentialRampToValueAtTime(0.001,t+(dur||3));
  g.connect(a._rev||a._comp||a.destination);
  const o=a.createOscillator();o.type=type;o.frequency.value=freq;
  o.connect(g);o.start(t);o.stop(t+(dur||3)+0.1);
}
function playBinaural(freqL,freqR,vol){
  const a=getAudio(),t=a.currentTime;
  [freqL,freqR].forEach(function(f,ch){
    const o=a.createOscillator();o.type='sine';o.frequency.value=f;
    const g=a.createGain();g.gain.setValueAtTime(vol||0.08,t);
    const pan=a.createStereoPanner();pan.pan.value=ch===0?-1:1;
    o.connect(pan);pan.connect(g);g.connect(a._comp||a.destination);
    o.start(t);o.stop(t+4);
  });
}

  delta:{hz:[0.5,4],col:'#4433ff',label:'Delta',benefit:'Deep sleep · cellular repair · unconscious healing',state:'Dreamless sleep'},

function drawThetaWaves(){
  thAge++;
  ctx.fillStyle='rgba(0,0,6,0.1)';ctx.fillRect(0,0,W,H);
  var b=TH_BANDS[thBand];
  var hz=(b.hz[0]+b.hz[1])/2;
  var period=60/hz;
  var phase=thAge/period*Math.PI*2;
  var cx=W/2,cy=H/2;
  for(var ring=0;ring<8;ring++){
    var rPhase=(phase+ring/8*Math.PI*2)%(Math.PI*2);
    var r=30+ring*Math.min(W,H)*.06+Math.sin(rPhase)*Math.min(W,H)*.03;
    var al=0.6-ring*.06;
    ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=b.col;ctx.lineWidth=2-ring*.18;
    ctx.shadowColor=b.col;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(cx,cy,Math.max(1,r),0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  var petalCount=Math.round(hz)+4;
  for(var p=0;p<petalCount;p++){
    var ang=p/petalCount*Math.PI*2+thAge*.005;
    var len=Math.min(W,H)*.25*(0.7+Math.sin(phase+p*.3)*.3);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
    ctx.strokeStyle=b.col+'cc';ctx.lineWidth=1.5;ctx.shadowColor=b.col;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(len,0);ctx.stroke();
    ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(len,0,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  ctx.save();ctx.textAlign='center';
  ctx.font='bold '+Math.min(W*.08,34)+'px Courier New';
  ctx.fillStyle=b.col;ctx.shadowColor=b.col;ctx.shadowBlur=25;
  ctx.fillText(b.label.toUpperCase(),cx,cy-10);
  ctx.font=Math.min(W*.04,16)+'px Courier New';ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText(b.hz[0]+'-'+b.hz[1]+' Hz',cx,cy+16);
  ctx.font=Math.min(W*.028,11)+'px Courier New';ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText(b.state,cx,cy+34);
  ctx.font=Math.min(W*.025,10)+'px Courier New';ctx.fillStyle=b.col+'aa';
  var words=b.benefit.split(' · ');
  words.forEach(function(w,i){ctx.fillText(w,cx,H*.82+i*14);});
  ctx.strokeStyle=b.col;ctx.lineWidth=2;ctx.shadowColor=b.col;ctx.shadowBlur=8;ctx.globalAlpha=0.6;
  ctx.beginPath();
  for(var x=0;x<W;x+=2){
    var y=H*.92+Math.sin((x/W*Math.PI*hz*2)+thAge*.08)*18+Math.sin((x/W*Math.PI*hz)+thAge*.12)*8;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }ctx.stroke();ctx.restore();
}

function drawSolfeggio(){
  sfAge++;
  ctx.fillStyle='rgba(0,0,8,0.1)';ctx.fillRect(0,0,W,H);
  if(!sfActive.size){
    ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.2)';

    ctx.restore();
    SOLFEGGIO.forEach(function(s,i){
      var ang=i/SOLFEGGIO.length*Math.PI*2-Math.PI/2;
      var r=Math.min(W,H)*.3;
      var x=W/2+Math.cos(ang)*r,y=H/2+Math.sin(ang)*r;
      ctx.save();ctx.globalAlpha=0.2;ctx.strokeStyle=s.col;ctx.lineWidth=1;

    });

  }
  var activeArr=[];sfActive.forEach(function(i){activeArr.push(i);});
  activeArr.forEach(function(i){
    var s=SOLFEGGIO[i];
    var phase=sfAge*(s.hz/200)*0.015;
    var cx=activeArr.length===1?W/2:W/2+Math.cos(i/SOLFEGGIO.length*Math.PI*2)*Math.min(W,H)*.18;
    var cy=activeArr.length===1?H/2:H/2+Math.sin(i/SOLFEGGIO.length*Math.PI*2)*Math.min(W,H)*.18;
    var pts=200;
    ctx.save();ctx.strokeStyle=s.col+'99';ctx.lineWidth=1.2;ctx.shadowColor=s.col;ctx.shadowBlur=6;
    ctx.beginPath();
    for(var t=0;t<pts;t++){
      var tt=t/pts*Math.PI*2*4;
      var lx=cx+Math.sin(tt*Math.round(s.hz/100)+phase)*60;
      var ly=cy+Math.sin(tt*Math.round(s.hz/120)+phase*1.3)*60;
      t===0?ctx.moveTo(lx,ly):ctx.lineTo(lx,ly);
    }ctx.closePath();ctx.stroke();
    var ringR=30+Math.sin(phase*10)*8;
    ctx.globalAlpha=0.5;ctx.strokeStyle=s.col;ctx.lineWidth=2;ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(cx,cy,Math.max(1,ringR),0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;ctx.textAlign='center';
    ctx.font='bold 12px Courier New';ctx.fillStyle=s.col;ctx.shadowBlur=10;
    ctx.fillText(s.hz+'Hz',cx,cy-ringR-8);
    ctx.font='9px Courier New';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.shadowBlur=0;
    ctx.fillText(s.name,cx,cy+ringR+12);
    ctx.restore();
  });
  if(activeArr.length===1){
    var s=SOLFEGGIO[activeArr[0]];
    ctx.save();ctx.textAlign='center';ctx.font='10px Courier New';ctx.fillStyle=s.col+'aa';
    ctx.fillText(s.meaning,W/2,H*.85);ctx.restore();
  }
}

// CYMATICS
var cymAge=0,cymHz=432,cymActive=false;
var CYM_PRESETS=[40,110,174,285,432,528,639,741,852,963,1000,2000];
function initCymatics(){cymAge=0;cymActive=false;renderCymatics();}
function renderCymatics(){
  var row=document.getElementById('extra');row.innerHTML='';
  var sl=document.createElement('input');sl.type='range';sl.min=40;sl.max=2000;sl.value=cymHz;
  sl.style.cssText='width:120px;accent-color:#00ffcc;';
  var lbl=document.createElement('span');lbl.style.cssText='color:#00ffcc;font-size:11px;font-family:Courier New,monospace;margin:0 6px;';
  lbl.textContent=cymHz+'Hz';
  sl.oninput=function(){cymHz=+sl.value;lbl.textContent=cymHz+'Hz';};
  row.appendChild(sl);row.appendChild(lbl);
  CYM_PRESETS.forEach(function(f){
    var b=document.createElement('button');b.className='xb';b.textContent=f;
    b.style.cssText='font-size:9px;padding:4px 7px;min-height:26px;color:'+(cymHz===f?'#00ffcc':'rgba(255,255,255,0.35)');
    b.onclick=function(){cymHz=f;sl.value=f;lbl.textContent=f+'Hz';if(cymActive)playFreqTone(f,3,0.1);renderCymatics();};
    row.appendChild(b);
  });
  var tog=document.createElement('button');tog.className='xb';tog.textContent=cymActive?'STOP':'TONE';
  tog.style.cssText='color:'+(cymActive?'#ff4444':'#00ffcc')+';border-color:'+(cymActive?'#ff444466':'#00ffcc66')+';';
  tog.onclick=function(){cymActive=!cymActive;if(cymActive)playFreqTone(cymHz,4,0.1);renderCymatics();};
  row.appendChild(tog);
}
function drawCymatics(){
  cymAge++;
  ctx.fillStyle='rgba(0,4,6,0.12)';ctx.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2,sc=Math.min(W,H)*.35;
  var n=Math.round(cymHz/80)+3,m=Math.round(cymHz/120)+2;
  ctx.save();ctx.strokeStyle='rgba(0,255,200,0.7)';ctx.lineWidth=1.5;ctx.shadowColor='#00ffcc';ctx.shadowBlur=8;
  ctx.beginPath();
  for(var t=0;t<400;t++){
    var a=t/400*Math.PI*2*4;
    var lx=cx+Math.sin(n*a+cymAge*.02)*sc;
    var ly=cy+Math.sin(m*a)*sc;
    t===0?ctx.moveTo(lx,ly):ctx.lineTo(lx,ly);
  }ctx.closePath();ctx.stroke();
  ctx.strokeStyle='rgba(255,100,255,0.3)';ctx.shadowColor='#ff44ff';ctx.shadowBlur=5;
  ctx.beginPath();
  for(var t=0;t<400;t++){
    var a=t/400*Math.PI*2*4;
    var lx=cx+Math.sin(n*a+cymAge*.02)*sc*.65+Math.sin(cymAge*.01)*8;
    var ly=cy+Math.sin(m*a)*sc*.65+Math.cos(cymAge*.013)*8;
    t===0?ctx.moveTo(lx,ly):ctx.lineTo(lx,ly);
  }ctx.closePath();ctx.stroke();
  ctx.restore();
  ctx.save();ctx.textAlign='center';
  ctx.font='bold '+Math.min(W*.08,34)+'px Courier New';
  ctx.fillStyle='rgba(0,255,200,0.15)';ctx.fillText(cymHz+'Hz',cx,cy+10);
  ctx.font='11px Courier New';ctx.fillStyle='rgba(0,255,200,0.5)';
  ctx.fillText('CYMATIC PATTERN',cx,H*.88);
  var SOLF2=SOLFEGGIO;
  var near=SOLF2[0];SOLF2.forEach(function(s){if(Math.abs(s.hz-cymHz)<Math.abs(near.hz-cymHz))near=s;});
  if(Math.abs(near.hz-cymHz)<50){ctx.fillStyle=near.col+'88';ctx.fillText(near.hz+'Hz: '+near.meaning,cx,H*.92);}
  ctx.restore();
}

// BINAURAL LAB
var binAge=0,binCarrier=200,binBeat=6,binPlaying=false;
var BIN_ZONES=[
  {name:'Delta',range:[0.5,4],col:'#4433ff',benefit:'Deep sleep / healing'},
  {name:'Theta',range:[4,8],col:'#aa44ff',benefit:'Meditation / creativity'},
  {name:'Alpha',range:[8,13],col:'#00aaff',benefit:'Relaxation / learning'},
  {name:'Beta',range:[13,30],col:'#00ff88',benefit:'Focus / alertness'},
  {name:'Gamma',range:[30,100],col:'#ffdd00',benefit:'Peak cognition'},
];
function initBinauralLab(){binAge=0;binPlaying=false;renderBinaural();}
function currentBinZone(){return BIN_ZONES.find(function(z){return binBeat>=z.range[0]&&binBeat<z.range[1];})||BIN_ZONES[0];}
function renderBinaural(){
  var row=document.getElementById('extra');row.innerHTML='';
  var z=currentBinZone();
  [['Carrier',binCarrier,40,500,10],['Beat Hz',binBeat,0.5,40,0.5]].forEach(function(cfg,li){
    var lbl=cfg[0],val=cfg[1],min=cfg[2],max=cfg[3],step=cfg[4];
    var wrap=document.createElement('div');wrap.style.cssText='display:flex;align-items:center;gap:6px;';
    var l=document.createElement('span');l.style.cssText='color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:1px;width:54px;font-family:Courier New,monospace;';l.textContent=lbl+':';
    var sl=document.createElement('input');sl.type='range';sl.min=min;sl.max=max;sl.step=step;sl.value=val;sl.style.cssText='width:90px;accent-color:'+z.col+';';
    var vl=document.createElement('span');vl.style.cssText='color:'+z.col+';font-size:10px;font-family:Courier New,monospace;min-width:42px;';vl.textContent=val+'Hz';
    sl.oninput=(function(idx,vlab){return function(){
      if(idx===0)binCarrier=+sl.value;else binBeat=+sl.value;
      vlab.textContent=(+sl.value)+'Hz';renderBinaural();
    };})(li,vl);
    wrap.appendChild(l);wrap.appendChild(sl);wrap.appendChild(vl);row.appendChild(wrap);
  });
  var tog=document.createElement('button');tog.className='xb';tog.textContent=binPlaying?'STOP':'PLAY BINAURAL';
  tog.style.cssText='color:'+(binPlaying?'#ff4444':'#00ff88')+';border-color:'+(binPlaying?'#ff444466':'#00ff8866')+';';
  tog.onclick=function(){binPlaying=!binPlaying;if(binPlaying)playBinaural(binCarrier,binCarrier+binBeat,0.1);renderBinaural();};
  row.appendChild(tog);
  var zl=document.createElement('div');
  zl.style.cssText='color:'+z.col+';font-size:9px;letter-spacing:2px;font-family:Courier New,monospace;text-align:center;width:100%;';
  zl.textContent=z.name.toUpperCase()+' - '+z.benefit;row.appendChild(zl);
}
function drawBinauralLab(){
  binAge++;
  ctx.fillStyle='rgba(0,0,8,0.1)';ctx.fillRect(0,0,W,H);
  var z=currentBinZone();var cx=W/2,cy=H/2;
  ctx.save();ctx.strokeStyle='#0066ff';ctx.lineWidth=1.5;ctx.shadowColor='#0066ff';ctx.shadowBlur=10;
  ctx.beginPath();
  for(var x=0;x<W/2;x+=2){
    var y=cy+Math.sin((x/W*Math.PI*4)+binAge*(binCarrier/500)*0.1)*40+Math.sin((x/W*Math.PI*2)+binAge*.03)*15;
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle='#ff4400';ctx.lineWidth=1.5;ctx.shadowColor='#ff4400';ctx.shadowBlur=10;
  ctx.beginPath();
  for(var x=W/2;x<W;x+=2){
    var bFreq=binCarrier+binBeat;
    var y=cy+Math.sin((x/W*Math.PI*4)+binAge*(bFreq/500)*0.1)*40+Math.sin((x/W*Math.PI*2)+binAge*.033)*15;
    x===W/2?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle=z.col;ctx.lineWidth=2.5;ctx.shadowColor=z.col;ctx.shadowBlur=15;ctx.globalAlpha=0.7;
  ctx.beginPath();
  for(var x=0;x<W;x+=2){
    var t=x/W*Math.PI*8;
    var y=cy-80+Math.sin(t+binAge*.04)*30*Math.cos(t/8+binAge*(binBeat/200)*0.05);
    x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }ctx.stroke();ctx.restore();
  var bw=W*.7,bx=(W-bw)/2,by=H*.75;
  BIN_ZONES.forEach(function(zn){
    var fw=bw*(zn.range[1]-zn.range[0])/44;var fx=bx+bw*(zn.range[0]-0.5)/44;
    ctx.fillStyle=zn.col+'33';ctx.fillRect(fx,by,fw,18);
    ctx.strokeStyle=(binBeat>=zn.range[0]&&binBeat<zn.range[1])?zn.col:zn.col+'44';ctx.lineWidth=1;
    ctx.strokeRect(fx,by,fw,18);
    ctx.fillStyle=zn.col;ctx.textAlign='center';ctx.font='8px Courier New';
    ctx.fillText(zn.name,fx+fw/2,by+12);
  });
  var indX=bx+bw*(Math.min(binBeat,40)-0.5)/44;
  ctx.fillStyle=z.col;ctx.shadowColor=z.col;ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(indX,by-8);ctx.lineTo(indX-5,by-16);ctx.lineTo(indX+5,by-16);ctx.closePath();ctx.fill();
  ctx.save();ctx.textAlign='center';ctx.shadowBlur=0;
  ctx.font='bold '+Math.min(W*.04,16)+'px Courier New';ctx.fillStyle=z.col;ctx.shadowColor=z.col;ctx.shadowBlur=15;
  ctx.fillText(z.name.toUpperCase()+' WAVE - '+binBeat+'Hz BEAT',cx,H*.2);
  ctx.font='11px Courier New';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.shadowBlur=0;
  ctx.fillText('L: '+binCarrier+'Hz  R: '+(binCarrier+binBeat)+'Hz',cx,H*.26);
  ctx.restore();
}

// COLOR FREQUENCY THERAPY
var COL_FREQS=[
  {nm:'Red',thz:430,col:'#ff2200',heal:'Energy, root, survival, action'},
  {nm:'Orange',thz:480,col:'#ff6600',heal:'Creativity, sacral, emotion, joy'},
  {nm:'Yellow',thz:520,col:'#ffdd00',heal:'Intellect, solar plexus, will'},
  {nm:'Green',thz:560,col:'#00cc44',heal:'Heart, balance, growth, healing'},
  {nm:'Cyan',thz:600,col:'#00ddcc',heal:'Communication, clarity, flow'},
  {nm:'Blue',thz:640,col:'#0044ff',heal:'Calm, throat, expression, peace'},
  {nm:'Indigo',thz:670,col:'#4400aa',heal:'Intuition, third eye, perception'},
  {nm:'Violet',thz:710,col:'#aa00ff',heal:'Transformation, crown, transcendence'},
];
var cfActive=3,cfAge=0,cfFlood=0;
function initColorFreq(){cfActive=3;cfAge=0;cfFlood=0;renderColorFreq();}
function renderColorFreq(){
  var row=document.getElementById('extra');row.innerHTML='';
  var wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:3px;flex-wrap:wrap;justify-content:center;width:100%;';
  COL_FREQS.forEach(function(c,i){
    var b=document.createElement('button');b.className='xb';
    b.style.cssText='background:'+c.col+(cfActive===i?'44':'11')+';border-color:'+c.col+(cfActive===i?'cc':'33')+';color:'+c.col+';font-size:9px;padding:4px 7px;min-height:32px;';
    b.innerHTML='<span style="display:block">'+c.nm+'</span><span style="opacity:.6;font-size:7px">'+c.thz+'THz</span>';
    b.onclick=(function(idx){return function(){cfActive=idx;cfFlood=60;playFreqTone(200+idx*30,2,0.08);renderColorFreq();};})(i);
    wrap.appendChild(b);
  });
  row.appendChild(wrap);
}
function drawColorFreq(){
  cfAge++;
  var c=COL_FREQS[cfActive];
  if(cfFlood>0){cfFlood--;var a=cfFlood/60*.2;ctx.fillStyle=c.col;ctx.globalAlpha=a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  ctx.fillStyle='rgba(0,0,6,0.08)';ctx.fillRect(0,0,W,H);
  var bh=12;COL_FREQS.forEach(function(cf,i){
    var x=i/COL_FREQS.length*W;var w2=W/COL_FREQS.length;var active=cf===c;
    ctx.fillStyle=cf.col+(active?'cc':'66');ctx.fillRect(x,44,w2-1,active?bh+4:bh);
  });
  var cx=W/2,cy=H/2;
  for(var ring=0;ring<12;ring++){
    var r=30+ring*Math.min(W,H)*.04+Math.sin(cfAge*.06+ring*.5)*15;
    var al=(0.6-ring*.04);
    if(r>1){ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=c.col;ctx.lineWidth=2.5-ring*.15;ctx.shadowColor=c.col;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
  }
  var sides=Math.round(c.thz/100)+3;
  ctx.save();ctx.strokeStyle=c.col+'66';ctx.lineWidth=1;ctx.shadowColor=c.col;ctx.shadowBlur=8;
  ctx.translate(cx,cy);ctx.rotate(cfAge*.005);
  ctx.beginPath();
  for(var s=0;s<=sides;s++){var a=s/sides*Math.PI*2;var rr=Math.min(W,H)*.2;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.closePath();ctx.stroke();ctx.restore();
  ctx.save();ctx.textAlign='center';
  ctx.font='bold '+Math.min(W*.08,32)+'px Courier New';ctx.fillStyle=c.col;ctx.shadowColor=c.col;ctx.shadowBlur=20;
  ctx.fillText(c.nm.toUpperCase(),cx,cy-10);
  ctx.font='15px Courier New';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.shadowBlur=0;
  ctx.fillText(c.thz+' THz',cx,cy+16);
  ctx.font='10px Courier New';ctx.fillStyle=c.col+'aa';
  ctx.fillText(c.heal,cx,H*.82);ctx.restore();
}

// CHAKRA RESONANCE
var CHAKRAS=[
  {name:'Root',hz:396,col:'#ff2200',pos:.85,mantra:'LAM',heal:'Security, grounding'},
  {name:'Sacral',hz:417,col:'#ff6600',pos:.72,mantra:'VAM',heal:'Creativity, emotion'},
  {name:'Solar',hz:528,col:'#ffdd00',pos:.59,mantra:'RAM',heal:'Power, confidence'},
  {name:'Heart',hz:639,col:'#00cc44',pos:.46,mantra:'YAM',heal:'Love, compassion'},
  {name:'Throat',hz:741,col:'#00aaff',pos:.33,mantra:'HAM',heal:'Expression, truth'},
  {name:'Third Eye',hz:852,col:'#4400cc',pos:.20,mantra:'AUM',heal:'Intuition, clarity'},
  {name:'Crown',hz:963,col:'#cc44ff',pos:.08,mantra:'OM',heal:'Unity, transcendence'},
];
var ckActive=new Set(),ckAge=0,ckPulse={};
function initChakra(){ckActive=new Set();ckAge=0;ckPulse={};renderChakra();}
function renderChakra(){
  var row=document.getElementById('extra');row.innerHTML='';
  var wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%;';
  CHAKRAS.forEach(function(c,i){
    var on=ckActive.has(i);
    var b=document.createElement('button');b.className='xb';
    b.style.cssText='color:'+(on?c.col:'rgba(255,255,255,0.35)')+';border-color:'+c.col+(on?'cc':'33')+';background:'+(on?c.col+'15':'transparent')+';font-size:10px;padding:5px 8px;';
    b.textContent=c.name;
    b.onclick=(function(idx){return function(){
      if(ckActive.has(idx)){ckActive.delete(idx);}
      else{ckActive.add(idx);ckPulse[idx]=60;playFreqTone(CHAKRAS[idx].hz,3,0.1);}
      renderChakra();
    };})(i);
    wrap.appendChild(b);
  });
  row.appendChild(wrap);
  var al=document.createElement('button');al.className='xb';al.textContent='ALL CHAKRAS';
  al.style.cssText='color:#ff44ff;border-color:#ff44ff44;font-size:10px;';
  al.onclick=function(){
    CHAKRAS.forEach(function(_,i){ckActive.add(i);ckPulse[i]=60;});
    renderChakra();
    CHAKRAS.forEach(function(c,i){setTimeout(function(){playFreqTone(c.hz,4,0.06);},i*200);});
  };
  row.appendChild(al);
}
function drawChakra(){
  ckAge++;ctx.fillStyle='rgba(0,0,8,0.1)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,H*.06);ctx.lineTo(W/2,H*.95);ctx.stroke();ctx.restore();
  CHAKRAS.forEach(function(c,i){
    var x=W/2,y=c.pos*H;var on=ckActive.has(i);
    var pulse=ckPulse[i]||0;if(pulse>0)ckPulse[i]=pulse-1;
    var r=on?14+Math.sin(ckAge*.08+i)*4:10;
    if(on){
      var petals=i+4;
      ctx.save();ctx.translate(x,y);ctx.rotate(ckAge*.02*(i%2===0?1:-1));
      for(var p=0;p<petals;p++){
        var a=p/petals*Math.PI*2;var len=r*3+Math.sin(ckAge*.06+p)*r;
        ctx.strokeStyle=c.col+'88';ctx.lineWidth=1;ctx.shadowColor=c.col;ctx.shadowBlur=8;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();
      }ctx.restore();
      if(pulse>0){var pr=r+60*(1-pulse/60);ctx.save();ctx.globalAlpha=pulse/60*.5;ctx.strokeStyle=c.col;ctx.lineWidth=2;ctx.shadowColor=c.col;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(x,y,Math.max(1,pr),0,Math.PI*2);ctx.stroke();ctx.restore();}
    }
    ctx.save();
    var g2=ctx.createRadialGradient(x,y,0,x,y,Math.max(1,r));
    g2.addColorStop(0,on?'rgba(255,255,255,0.9)':c.col+'44');
    g2.addColorStop(1,c.col+(on?'cc':'33'));
    ctx.fillStyle=g2;ctx.shadowColor=c.col;ctx.shadowBlur=on?20:5;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    var side=i%2===0?1:-1;
    ctx.save();ctx.textAlign=side>0?'left':'right';
    ctx.font='bold 13px Courier New';ctx.fillStyle=on?c.col:'rgba(255,255,255,0.3)';ctx.shadowColor=on?c.col:'transparent';ctx.shadowBlur=on?8:0;
    ctx.fillText(c.name,x+side*(r+14),y-4);
    ctx.font='9px Courier New';ctx.fillStyle='rgba(255,255,255,0.3)';ctx.shadowBlur=0;
    ctx.fillText(c.hz+'Hz - '+c.mantra,x+side*(r+14),y+10);
    if(on){ctx.fillStyle=c.col+'88';ctx.fillText(c.heal,x+side*(r+14),y+23);}
    ctx.restore();
  });
}

// ROUTER
var FREQ_MODES=['thetawaves','solfeggio','cymatics','binaurallab','colorfreq','chakra'];
function initFreqMode(m){
  if(m==='thetawaves')initThetaWaves();
  else if(m==='solfeggio')initSolfeggio();
  else if(m==='cymatics')initCymatics();
  else if(m==='binaurallab')initBinauralLab();
  else if(m==='colorfreq')initColorFreq();
  else if(m==='chakra')initChakra();
}
function drawFreqMode(){
  if(mode==='thetawaves')drawThetaWaves();
  else if(mode==='solfeggio')drawSolfeggio();
  else if(mode==='cymatics')drawCymatics();
  else if(mode==='binaurallab')drawBinauralLab();
  else if(mode==='colorfreq')drawColorFreq();
  else if(mode==='chakra')drawChakra();
}

resize();loop();
