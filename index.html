<script>
// ── Canvas setup ─────────────────────────────────────────────────────────
const tc=document.getElementById('tc'),ctx=tc.getContext('2d');
const cov=document.getElementById('cov'),cctx=cov.getContext('2d');
let W,H,mode='harp',frame=0,mx=0,my=0,mdown=false,aCtx=null,coverOpen=false;

function resize(){W=tc.width=window.innerWidth;H=tc.height=window.innerHeight;if(!coverOpen)initMode()}
window.addEventListener('resize',resize);

// ── Audio ─────────────────────────────────────────────────────────────────
function getAudio(){
  if(!aCtx){aCtx=new(window.AudioContext||window.webkitAudioContext)();
    const rev=aCtx.createConvolver();
    const buf=aCtx.createBuffer(2,aCtx.sampleRate*2,aCtx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)}
    rev.buffer=buf;const rg=aCtx.createGain();rg.gain.value=0.25;rev.connect(rg);rg.connect(aCtx.destination);
    aCtx._rev=rev}
  return aCtx}
function playNote(f,dur=1.5,vol=0.35){
  const a=getAudio(),t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  g.connect(a.destination);g.connect(a._rev);
  [[1,1],[2,0.4],[3,0.2],[4,0.1]].forEach(([h,w])=>{const o=a.createOscillator();o.frequency.value=f*h;o.type='sine';const hg=a.createGain();hg.gain.value=w;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+dur+0.1)})}
function playGlass(){
  const a=getAudio(),t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.2);g.connect(a.destination);
  [1200,1800,2400,3000].forEach((f,i)=>{const o=a.createOscillator();o.frequency.value=f+Math.random()*200;const hg=a.createGain();hg.gain.value=0.2;o.connect(hg);hg.connect(g);o.start(t+i*0.01);o.stop(t+1.5)})}
function playBubble(){
  const a=getAudio(),t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);g.connect(a.destination);
  const o=a.createOscillator();o.type='sine';const f=400+Math.random()*800;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+0.15);o.frequency.exponentialRampToValueAtTime(f*0.5,t+0.4);o.connect(g);o.start(t);o.stop(t+0.5)}
function playBoom(){
  const a=getAudio(),t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.001,t+1);g.connect(a.destination);
  const buf=a.createBuffer(1,a.sampleRate*0.8,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const src=a.createBufferSource();src.buffer=buf;const flt=a.createBiquadFilter();flt.type='lowpass';flt.frequency.value=500;src.connect(flt);flt.connect(g);src.start(t)}

// ── Particles ─────────────────────────────────────────────────────────────
const PARTS=[];
function addP(x,y,vx,vy,col,life=80,sz=3,grav=0.15){PARTS.push({x,y,vx,vy,col,life,ml:life,sz,grav,rot:Math.random()*360,rs:(Math.random()-0.5)*8})}
function tickP(){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.98;p.life--;p.rot+=p.rs;const a=p.life/p.ml;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore();if(p.life<=0)PARTS.splice(i,1)}}

// ── Stars ─────────────────────────────────────────────────────────────────
const STARS=[];
function mkStars(){STARS.length=0;for(let i=0;i<200;i++)STARS.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5,b:Math.random()})}
function drawStars(){STARS.forEach(s=>{const b=0.4+0.6*Math.abs(Math.sin(frame*0.02+s.b*10));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${b*0.7})`;ctx.fill()})}

// ══════════ HARP (ENHANCED) ═══════════════════════════════════════════════

// ── Audio fix: compressor + throttle ─────────────────────────────────────
let masterComp=null,noteCount=0,lastNoteT=0;
function getAudioH(){
  const a=getAudio();
  if(!a._comp){
    a._comp=a.createDynamicsCompressor();a._comp.threshold.value=-18;a._comp.knee.value=20;a._comp.ratio.value=8;a._comp.attack.value=0.003;a._comp.release.value=0.15;a._comp.connect(a.destination);
    a._rev.disconnect();a._rev.connect(a._comp)}
  return a}
function playWireNote(freq,vol=0.3,dur=1.8){
  const now=performance.now();if(now-lastNoteT<40)return;lastNoteT=now;
  const a=getAudioH(),t=a.currentTime;
  if(noteCount>6)return;noteCount++;
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  g.connect(a._comp);
  [[1,1],[2,0.35],[3,0.15],[4,0.07]].forEach(([h,w])=>{const o=a.createOscillator();o.type='sine';o.frequency.value=freq*h;const hg=a.createGain();hg.gain.value=w;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+dur+0.05)});
  setTimeout(()=>noteCount--,dur*1000)}
function playSparkNote(){
  const a=getAudioH(),t=a.currentTime;
  const g=a.createGain();g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);g.connect(a._comp);
  const o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(800+Math.random()*1200,t);o.frequency.exponentialRampToValueAtTime(200,t+0.25);o.connect(g);o.start(t);o.stop(t+0.3)}

// ── Wire definitions ───────────────────────────────────────────────────────
let hWires=[],hIntersects=[],hDragWire=-1,hDragT=0;
let hMoon={a:0,r:0,cx:0,cy:0,rs:60},hUFOs=[],hShips=[],hSparks=[];
const WNOTES=[65.41,73.42,82.41,98,110,130.81,146.83,164.81,196,220,261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98];
const WCOLS=['#ff6b6b','#ff9f43','#ffd93d','#6bcb77','#00d4d4','#4d96ff','#a855f7','#e84393','#00ff88','#ff0066','#00ccff','#cc00ff','#ff6600','#4fc3f7','#b2ff59','#ffb347','#ff6b6b','#ff9f43','#ffd93d','#6bcb77','#00d4d4','#4d96ff','#a855f7','#e84393'];

function initHarpGalactic(){
  hWires=[];hIntersects=[];hSparks=[];
  const L=80,R=W-80,T=Math.max(H*0.12,60),B=H-60;

  // Vertical strings
  const nV=12;for(let i=0;i<nV;i++){const x=L+(R-L)*i/(nV-1);hWires.push({type:'v',x1:x,y1:T,x2:x,y2:B,bend:0,vel:0,note:WNOTES[i],col:WCOLS[i],lp:0,lit:0})}
  // Horizontal strings
  const nH=8;for(let i=0;i<nH;i++){const y=T+(B-T)*(i+1)/(nH+1);hWires.push({type:'h',x1:L,y1:y,x2:R,y2:y,bend:0,vel:0,note:WNOTES[12+i%12],col:WCOLS[12+i%8],lp:0,lit:0})}
  // Diagonal \ (top-left to bottom-right)
  const nD=5;for(let i=0;i<nD;i++){const t=i/(nD+1);hWires.push({type:'d1',x1:L+(R-L)*t*0.7,y1:T,x2:L+(R-L)*(t*0.7+0.5),y2:B,bend:0,vel:0,note:WNOTES[(i*3)%24],col:WCOLS[(i*5)%24],lp:0,lit:0})}
  // Diagonal / (top-right to bottom-left)
  for(let i=0;i<nD;i++){const t=i/(nD+1);hWires.push({type:'d2',x1:R-(R-L)*t*0.7,y1:T,x2:R-(R-L)*(t*0.7+0.5),y2:B,bend:0,vel:0,note:WNOTES[(i*4+2)%24],col:WCOLS[(i*3+4)%24],lp:0,lit:0})}

  // Pre-calc intersections
  for(let i=0;i<hWires.length;i++)for(let j=i+1;j<hWires.length;j++){
    const a=hWires[i],b=hWires[j];if(a.type===b.type)continue;
    const ix=lineIsect(a.x1,a.y1,a.x2,a.y2,b.x1,b.y1,b.x2,b.y2);
    if(ix)hIntersects.push({i,j,x:ix.x,y:ix.y,spark:0})}

  // Space objects
  hMoon={a:Math.random()*Math.PI*2,orbitR:Math.min(W,H)*0.22,cx:W/2,cy:H/2,rs:55,x:0,y:0};
  hUFOs=[];for(let i=0;i<3;i++)hUFOs.push({x:100+Math.random()*(W-200),y:150+Math.random()*(H*0.5),vx:(Math.random()-.5)*0.6,vy:(Math.random()-.5)*0.3,phase:Math.random()*Math.PI*2,beam:false,beamT:0,glow:1,col:WCOLS[i*4%24]});
  hShips=[];for(let i=0;i<2;i++)hShips.push({x:Math.random()*W,y:100+Math.random()*(H*0.4),vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*0.4,phase:Math.random()*Math.PI*2,exhaust:[],col:WCOLS[(i*6+3)%24]})}

function lineIsect(x1,y1,x2,y2,x3,y3,x4,y4){
  const d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);if(Math.abs(d)<0.001)return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
  const u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/d;
  if(t>0.02&&t<0.98&&u>0.02&&u<0.98)return{x:x1+t*(x2-x1),y:y1+t*(y2-y1)};return null}

// ── Wire mid-point (for drag hit) ──────────────────────────────────────────
function wireMidPt(w,t=0.5){
  const bend=w.bend||0;
  const nx=-(w.y2-w.y1),ny=(w.x2-w.x1),len=Math.hypot(nx,ny)||1;
  const mx=w.x1+(w.x2-w.x1)*t,my=w.y1+(w.y2-w.y1)*t;
  const bx=bend*(nx/len),by=bend*(ny/len);
  return{x:mx+bx*Math.sin(t*Math.PI),y:my+by*Math.sin(t*Math.PI)}}

// ── Draw space background ─────────────────────────────────────────────────
function drawHarpBg(){
  // Dark matter wisps
  for(let i=0;i<5;i++){
    const wx=W*(.15+i*.17)+Math.sin(frame*.008+i)*30;const wy=H*(.3+i*.12)+Math.cos(frame*.006+i)*20;
    const dg=ctx.createRadialGradient(wx,wy,0,wx,wy,100+i*20);
    dg.addColorStop(0,`rgba(${20+i*10},${i*5},${40+i*10},0.12)`);dg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(wx,wy,60+i*8,30+i*5,i*.5,0,Math.PI*2);ctx.fill()}
  // Nebula glow
  [[W*.25,H*.3,'rgba(80,0,160,0.08)'],[W*.75,H*.6,'rgba(0,80,160,0.07)'],[W*.5,H*.8,'rgba(0,120,80,0.06)']].forEach(([x,y,c])=>{const g=ctx.createRadialGradient(x,y,0,x,y,250);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)})}

// ── Moon ─────────────────────────────────────────────────────────────────
function drawMoon(){
  hMoon.a+=0.003;
  hMoon.x=hMoon.cx+Math.cos(hMoon.a)*hMoon.orbitR;
  hMoon.y=hMoon.cy+Math.sin(hMoon.a)*hMoon.orbitR*.5;
  const {x,y,rs}=hMoon;
  // Orbit ring
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.setLineDash([4,8]);
  ctx.beginPath();ctx.ellipse(hMoon.cx,hMoon.cy,hMoon.orbitR,hMoon.orbitR*.5,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  // Glow
  const mg=ctx.createRadialGradient(x,y,0,x,y,rs*1.5);mg.addColorStop(0,'rgba(200,220,255,0.10)');mg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(x,y,rs*1.5,0,Math.PI*2);ctx.fill();
  // Moon body
  const mb=ctx.createRadialGradient(x-rs*.25,y-rs*.25,0,x,y,rs);mb.addColorStop(0,'#d4d8e8');mb.addColorStop(.6,'#9aa0b8');mb.addColorStop(1,'#606880');ctx.fillStyle=mb;ctx.shadowColor='rgba(200,220,255,0.8)';ctx.shadowBlur=25;ctx.beginPath();ctx.arc(x,y,rs,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  // Craters
  [[-.3,-.2,8],[.25,.3,12],[-.1,.35,6],[.4,-.1,5]].forEach(([dx,dy,cr])=>{ctx.fillStyle='rgba(80,90,120,0.5)';ctx.beginPath();ctx.arc(x+dx*rs,y+dy*rs,cr,0,Math.PI*2);ctx.fill()});
  // Gravity pull lines
  ctx.strokeStyle='rgba(200,220,255,0.06)';ctx.lineWidth=1;
  hWires.forEach(w=>{const mp=wireMidPt(w);const d=Math.hypot(mp.x-x,mp.y-y);if(d<200){const str=(200-d)/200;ctx.globalAlpha=str*.4;ctx.beginPath();ctx.moveTo(mp.x,mp.y);ctx.lineTo(x,y);ctx.stroke();ctx.globalAlpha=1}});
  ctx.restore()}

// ── UFOs ─────────────────────────────────────────────────────────────────
function drawUFOs(){
  hUFOs.forEach((u,ui)=>{
    u.x+=u.vx+Math.sin(frame*.018+u.phase)*.8;u.y+=u.vy+Math.cos(frame*.012+u.phase)*.4;
    if(u.x<60||u.x>W-60)u.vx*=-1;if(u.y<80||u.y>H*.65)u.vy*=-1;
    if(Math.random()<.002)u.beam=!u.beam;
    ctx.save();ctx.translate(u.x,u.y);
    // Beam
    if(u.beam){const bg=ctx.createLinearGradient(0,12,0,180);bg.addColorStop(0,u.col+'55');bg.addColorStop(1,u.col+'00');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(-22,12);ctx.lineTo(22,12);ctx.lineTo(50,180);ctx.lineTo(-50,180);ctx.closePath();ctx.fill()}
    // Glow
    const ug=ctx.createRadialGradient(0,0,0,0,0,60);ug.addColorStop(0,u.col+'22');ug.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=ug;ctx.beginPath();ctx.arc(0,0,60,0,Math.PI*2);ctx.fill();
    // Saucer
    ctx.fillStyle='rgba(160,170,210,0.9)';ctx.shadowColor=u.col;ctx.shadowBlur=20;ctx.beginPath();ctx.ellipse(0,0,48,12,0,0,Math.PI*2);ctx.fill();
    // Dome
    ctx.fillStyle=u.col+'44';ctx.strokeStyle=u.col+'88';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,-5,22,16,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    // Spinning lights
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2+frame*.06+u.phase;const lc=`hsl(${(frame*3+i*51+ui*40)%360},100%,65%)`;ctx.fillStyle=lc;ctx.shadowColor=lc;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(Math.cos(a)*35,3+Math.sin(a)*3,4,0,Math.PI*2);ctx.fill()}
    ctx.shadowBlur=0;ctx.restore()})}

// ── Spaceships ───────────────────────────────────────────────────────────
function drawShips(){
  hShips.forEach((s,si)=>{
    s.x+=s.vx+Math.sin(frame*.01+s.phase)*.5;s.y+=s.vy+Math.cos(frame*.008+s.phase)*.3;
    if(s.x<-100)s.x=W+100;if(s.x>W+100)s.x=-100;if(s.y<60||s.y>H*.6)s.vy*=-1;
    const ang=Math.atan2(s.vy,s.vx);
    if(frame%3===0)s.exhaust.push({x:s.x-Math.cos(ang)*40,y:s.y-Math.sin(ang)*40,life:25,vx:(Math.random()-.5)*2-Math.cos(ang)*2,vy:(Math.random()-.5)*2-Math.sin(ang)*2,col:['#ff6600','#ff9900','#ffcc00','#ff4400'][Math.floor(Math.random()*4)]});
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);
    // Exhaust particles
    s.exhaust.forEach((e,ei)=>{e.x+=e.vx;e.y+=e.vy;e.life--;ctx.beginPath();ctx.arc(e.x-s.x,e.y-s.y,3*(e.life/25),0,Math.PI*2);ctx.fillStyle=e.col;ctx.globalAlpha=e.life/25*.6;ctx.fill();ctx.globalAlpha=1;if(e.life<=0)s.exhaust.splice(ei,1)});
    // Hull
    ctx.fillStyle='rgba(140,160,200,0.9)';ctx.strokeStyle=s.col;ctx.lineWidth=1.5;ctx.shadowColor=s.col;ctx.shadowBlur=15;
    ctx.beginPath();ctx.moveTo(45,0);ctx.lineTo(-25,-14);ctx.lineTo(-35,0);ctx.lineTo(-25,14);ctx.closePath();ctx.fill();ctx.stroke();
    // Cockpit
    ctx.fillStyle=s.col+'66';ctx.beginPath();ctx.ellipse(18,0,14,8,0,0,Math.PI*2);ctx.fill();
    // Wing engines
    ctx.fillStyle='rgba(100,120,180,0.7)';[-1,1].forEach(sy=>{ctx.beginPath();ctx.moveTo(-10,sy*14);ctx.lineTo(-30,sy*24);ctx.lineTo(-38,sy*22);ctx.lineTo(-28,sy*10);ctx.closePath();ctx.fill()});
    ctx.shadowBlur=0;ctx.restore()})}

// ── Draw wires ────────────────────────────────────────────────────────────
function drawHarpWires(){
  // Update physics + gravity
  const mx2=hMoon.x,my2=hMoon.y;
  hWires.forEach((w,wi)=>{
    if(wi===hDragWire&&mdown){/* dragged: handled elsewhere */}
    else{w.vel+=-w.bend*.15-w.vel*.12;w.bend+=w.vel}
    w.lit=Math.max(0,w.lit-.03);
    // Moon gravity on bend
    const mp=wireMidPt(w);const dx2=mx2-mp.x,dy2=my2-mp.y,dist2=Math.hypot(dx2,dy2);
    if(dist2<150){const gStr=(150-dist2)/150*0.8;const nx2=-(w.y2-w.y1),ny2=w.x2-w.x1,nlen=Math.hypot(nx2,ny2)||1;const gravBend=(dx2*(nx2/nlen)+dy2*(ny2/nlen))*gStr*.008;w.bend+=gravBend}
    // Cap bend to prevent giant blobs
    w.bend=Math.max(-60,Math.min(60,w.bend));
    // Draw
    const segs=24;ctx.save();ctx.lineWidth=1.8+w.lit;ctx.shadowColor=w.col;ctx.shadowBlur=8+w.lit*20;
    const alpha=0.55+w.lit*.45;
    const gw=ctx.createLinearGradient(w.x1,w.y1,w.x2,w.y2);gw.addColorStop(0,w.col+'44');gw.addColorStop(.5,w.col+Math.floor(alpha*255).toString(16).padStart(2,'0'));gw.addColorStop(1,w.col+'44');ctx.strokeStyle=gw;
    ctx.beginPath();
    for(let k=0;k<=segs;k++){const t=k/segs;const bx=Math.max(-40,Math.min(40,w.bend))*0.6*Math.sin(t*Math.PI);const nx3=-(w.y2-w.y1),ny3=w.x2-w.x1,nlen3=Math.hypot(nx3,ny3)||1;const px=w.x1+(w.x2-w.x1)*t+bx*(nx3/nlen3);const py=w.y1+(w.y2-w.y1)*t+bx*(ny3/nlen3);k===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
    ctx.stroke();
    // End dots
    ctx.fillStyle=w.col;ctx.shadowBlur=w.lit*15+5;ctx.beginPath();ctx.arc(w.x1,w.y1,3+w.lit,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(w.x2,w.y2,3+w.lit,0,Math.PI*2);ctx.fill();
    ctx.restore()})}

// ── Intersections & sparks ────────────────────────────────────────────────
function drawHarpIntersects(){
  hIntersects.forEach(ix=>{
    const wa=hWires[ix.i],wb=hWires[ix.j];const energy=(Math.abs(wa.bend)+Math.abs(wb.bend))*.15;
    ix.spark=Math.max(0,ix.spark-.04+energy*.1);
    if(energy>.5&&ix.spark<.5&&Math.random()<.3){ix.spark=1;playSparkNote();hSparks.push({x:ix.x,y:ix.y,life:20,col:wa.col})}
    if(ix.spark>.1){
      ctx.save();ctx.globalAlpha=ix.spark*.8;ctx.shadowColor=wa.col;ctx.shadowBlur=20*ix.spark;
      ctx.strokeStyle=wa.col;ctx.lineWidth=1;
      for(let s=0;s<6;s++){const a=s/6*Math.PI*2+frame*.1+ix.x*.01;const len=8+ix.spark*12;ctx.beginPath();ctx.moveTo(ix.x,ix.y);ctx.lineTo(ix.x+Math.cos(a)*len,ix.y+Math.sin(a)*len);ctx.stroke()}
      ctx.fillStyle=wb.col;ctx.beginPath();ctx.arc(ix.x,ix.y,3*ix.spark,0,Math.PI*2);ctx.fill();ctx.restore()}});
  // Spark particles
  for(let i=hSparks.length-1;i>=0;i--){const s=hSparks[i];s.life--;ctx.save();ctx.globalAlpha=s.life/20;ctx.fillStyle=s.col;ctx.shadowColor=s.col;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(s.x+(Math.random()-.5)*s.life,s.y+(Math.random()-.5)*s.life,2+Math.random()*3,0,Math.PI*2);ctx.fill();ctx.restore();if(s.life<=0)hSparks.splice(i,1)}}

// ── Harp frame labels ─────────────────────────────────────────────────────
function drawHarpFrame(){
  ctx.save();
  const arch=ctx.createLinearGradient(W*.08,0,W*.92,0);arch.addColorStop(0,'rgba(0,255,136,0.2)');arch.addColorStop(.5,'rgba(0,204,255,0.4)');arch.addColorStop(1,'rgba(204,0,255,0.2)');
  ctx.strokeStyle=arch;ctx.lineWidth=3;ctx.shadowColor='#0ff';ctx.shadowBlur=25;
  ctx.beginPath();ctx.moveTo(W*.06,H*.92);ctx.bezierCurveTo(W*.06,H*.04,W*.94,H*.04,W*.94,H*.92);ctx.stroke();
  const bg2=ctx.createLinearGradient(W*.06,0,W*.94,0);bg2.addColorStop(0,'rgba(0,255,136,0.5)');bg2.addColorStop(1,'rgba(204,0,255,0.5)');
  ctx.strokeStyle=bg2;ctx.lineWidth=5;ctx.shadowColor='#0ff';ctx.shadowBlur=18;
  ctx.beginPath();ctx.moveTo(W*.06,H*.92);ctx.lineTo(W*.94,H*.92);ctx.stroke();
  ctx.restore()}

// ── Hit test ──────────────────────────────────────────────────────────────
function harpHit(x,y){let best=-1,bd=9999;hWires.forEach((w,i)=>{const mp=wireMidPt(w);const d=distPtSeg(x,y,w.x1,w.y1,w.x2,w.y2);const d2=Math.hypot(x-mp.x,y-mp.y);const dd=Math.min(d,d2);if(dd<28&&dd<bd){bd=dd;best=i}});return best}
function distPtSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(px-x1,py-y1);const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}

// ── Harp input handlers ───────────────────────────────────────────────────
function harpDnG(x,y){hDragWire=harpHit(x,y)}
function harpMvG(x,y){
  if(hDragWire<0)return;
  const w=hWires[hDragWire];
  const nx=-(w.y2-w.y1),ny=w.x2-w.x1,nlen=Math.hypot(nx,ny)||1;
  const dx3=x-((w.x1+w.x2)*.5),dy3=y-((w.y1+w.y2)*.5);
  const newBend=Math.max(-50,Math.min(50,(dx3*(nx/nlen)+dy3*(ny/nlen))));
  if(Math.abs(newBend-w.bend)>3&&performance.now()-w.lp>80){
    w.lp=performance.now();w.lit=1;
    playWireNote(w.note,Math.min(.5,Math.abs(newBend)/80),2);
    hIntersects.filter(ix=>ix.i===hDragWire||ix.j===hDragWire).forEach(ix=>ix.spark=Math.min(1,ix.spark+.5))}
  w.bend=Math.max(-50,Math.min(50,newBend))}
function harpUpG(){
  if(hDragWire>=0){const w=hWires[hDragWire];if(Math.abs(w.bend)>6){w.lit=1;playWireNote(w.note,Math.min(.5,Math.abs(w.bend)/60),2.2)}}
  hDragWire=-1}

function drawHarpGalactic(){
  drawHarpBg();
  drawMoon();
  drawUFOs();
  drawShips();
  drawHarpFrame();
  drawHarpWires();
  drawHarpIntersects()}

// ── Classic Harp ─────────────────────────────────────────────────────────
let harpV='galactic'; // 'galactic' | 'classic'
const CHN=[130.81,146.83,164.81,196,220,261.63,293.66,329.63,392,440,523.25,587.33];

function initHarpClassic(){

function drawHarpClassic(){

  ctx.strokeStyle=bg2;ctx.lineWidth=6;ctx.shadowColor='#0ff';ctx.shadowBlur=15;
  ctx.beginPath();ctx.moveTo(W*.06,H*.92);ctx.lineTo(W*.94,H*.92);ctx.stroke();ctx.restore();

    const segs=30,t=frame*0.08;ctx.save();ctx.lineWidth=2;ctx.shadowColor=s.col;ctx.shadowBlur=(Math.abs(s.bend)>3||s.pt>frame-40)?18:6;
    const sg=ctx.createLinearGradient(0,s.y0,0,s.y1);sg.addColorStop(0,s.col+'88');sg.addColorStop(.5,s.col);sg.addColorStop(1,s.col+'88');ctx.strokeStyle=sg;
    ctx.beginPath();for(let k=0;k<=segs;k++){const fr=k/segs,yk=s.y0+(s.y1-s.y0)*fr;const w2=Math.sin(fr*Math.PI)*s.bend+Math.sin(fr*Math.PI*2+t+s.vp)*Math.max(0,(s.pt-frame+60)/60)*4;k===0?ctx.moveTo(s.x+w2,yk):ctx.lineTo(s.x+w2,yk)}ctx.stroke();ctx.restore();
    ctx.beginPath();ctx.arc(s.x,s.y0-8,5,0,Math.PI*2);ctx.fillStyle=s.col;ctx.shadowColor=s.col;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle=s.col+'88';ctx.font='9px Courier New';ctx.textAlign='center';ctx.fillText(['C','D','E','G','A','C','D','E','G','A','C','D'][i],s.x,H*.96)})}
function classicDn(x,y){let bi=-1,bd=9999;cStr.forEach((s,i)=>{const d=Math.abs(x-s.x);if(d<40&&d<bd){bd=d;bi=i}});cDI=bi}
function classicMv(x,y){if(cDI<0)return;const s=cStr[cDI];cDB=(x-s.x)*1.2;if(Math.abs(cDB)>4&&frame-s.pt>15){playWireNote(s.note,2.5,Math.min(.5,Math.abs(cDB)/80));s.pt=frame}}
function classicUp(){if(cDI>=0){const s=cStr[cDI];if(Math.abs(s.bend)>8)playWireNote(s.note,2.5,Math.min(.5,Math.abs(s.bend)/60));s.pt=frame}cDI=-1;cDB=0}

function harpDn(x,y){if(harpV==='galactic')harpDnG(x,y);else classicDn(x,y)}

// ══════════ GLASS ═════════════════════════════════════════════════════════
let gPanels=[],glassType='standard';
const GTYPES=['standard','stained','mirror','frosted','gothic','mosaic','neon','ancient'];

function initGlass(){
  gPanels=[];
  if(glassType==='standard'||glassType==='neon'||glassType==='ancient'){
    const cl=6,rw=3;for(let r=0;r<rw;r++)for(let c=0;c<cl;c++){
      const col=glassType==='neon'?['#00ff88','#ff0066','#00ccff','#ffff00','#cc00ff','#ff6600'][c%6]:glassType==='ancient'?['#c8a87a','#b5956a','#d4b896','#a08060','#bc9070','#caa880'][c%6]:['#4fc3f7','#ce93d8','#80deea','#fff176','#b2ff59','#ff8a65'][c%6];
      gPanels.push({type:glassType,x:W/cl*c+20,y:H*.15+r*(H*.7/rw)+10,w:W/cl-40,h:H*.7/rw-20,broken:false,col,crack:Math.random()<.3&&glassType==='ancient'})}}
  else if(glassType==='stained'){
    const cl=5,rw=3;for(let r=0;r<rw;r++)for(let c=0;c<cl;c++){
      gPanels.push({type:'stained',x:W/cl*c+15,y:H*.12+r*(H*.72/rw)+8,w:W/cl-30,h:H*.72/rw-16,broken:false,col:['#ff4444','#4488ff','#44ff88','#ffaa00','#cc44ff','#ff88cc','#44ffff','#ffff44'][Math.floor(Math.random()*8)],tiles:makeTiles(W/cl-30,H*.72/rw-16)})}}
  else if(glassType==='mirror'){
    const cl=4,rw=2;for(let r=0;r<rw;r++)for(let c=0;c<cl;c++){
      gPanels.push({type:'mirror',x:W/cl*c+25,y:H*.2+r*(H*.55/rw)+12,w:W/cl-50,h:H*.55/rw-24,broken:false,col:'#c0c8d8',shine:Math.random()*360})}}
  else if(glassType==='frosted'){
    const cl=4,rw=3;for(let r=0;r<rw;r++)for(let c=0;c<cl;c++){
      gPanels.push({type:'frosted',x:W/cl*c+18,y:H*.15+r*(H*.68/rw)+10,w:W/cl-36,h:H*.68/rw-20,broken:false,col:'#ddeeff',noise:makeNoise(W/cl-36,H*.68/rw-20)})}}
  else if(glassType==='gothic'){
    const cl=5,rw=2;for(let r=0;r<rw;r++)for(let c=0;c<cl;c++){
      gPanels.push({type:'gothic',x:W/cl*c+20,y:H*.12+r*(H*.74/rw)+10,w:W/cl-40,h:H*.74/rw-20,broken:false,col:['#6644cc','#cc4466','#4466cc','#44aa88','#cc8844'][c%5]})}}
  else if(glassType==='mosaic'){
    for(let i=0;i<30;i++){const sz=40+Math.random()*60;gPanels.push({type:'mosaic',x:Math.random()*(W-sz-40)+20,y:H*.12+Math.random()*(H*.74-sz),w:sz,h:sz,broken:false,col:`hsl(${Math.random()*360},80%,60%)`,rot:Math.random()*Math.PI*.5})}}
  addGlassExtra()}

function makeTiles(w,h){const t=[];for(let i=0;i<6;i++)t.push({x:Math.random()*w,y:Math.random()*h,col:`hsl(${Math.random()*360},90%,55%)`});return t}
function makeNoise(w,h){const n=[];for(let i=0;i<12;i++)n.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*15+5});return n}

function drawGlass(){
  gPanels.forEach(p=>{
    if(p.broken)return;
    ctx.save();
    const t=p.type||'standard';
    if(t==='standard'||t==='neon'||t==='ancient'){
      const g=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y+p.h);g.addColorStop(0,p.col+'30');g.addColorStop(.5,p.col+(t==='neon'?'80':'60'));g.addColorStop(1,p.col+'20');ctx.fillStyle=g;ctx.strokeStyle=t==='ancient'?'#8a6040':p.col;ctx.lineWidth=t==='ancient'?3:2;ctx.globalAlpha=.75;ctx.shadowColor=p.col;ctx.shadowBlur=t==='neon'?25:12;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeRect(p.x,p.y,p.w,p.h);
      if(t==='ancient'&&p.crack){ctx.strokeStyle='rgba(80,50,20,0.5)';ctx.lineWidth=1;ctx.beginPath();const cx2=p.x+p.w*.4,cy2=p.y+p.h*.3;ctx.moveTo(cx2,cy2);ctx.lineTo(cx2+p.w*.3,cy2+p.h*.5);ctx.moveTo(cx2,cy2);ctx.lineTo(cx2-p.w*.2,cy2+p.h*.3);ctx.stroke()}
      if(t==='neon'){ctx.globalAlpha=.2;ctx.fillStyle='#fff';ctx.fillRect(p.x+4,p.y+4,6,p.h*.5)}
      else{ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.fillRect(p.x+8,p.y+8,p.w*.12,p.h*.4)}}
    else if(t==='stained'){
      ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.shadowColor=p.col;ctx.shadowBlur=12;
      // Lead frame
      ctx.fillStyle=p.col+'88';ctx.fillRect(p.x,p.y,p.w,p.h);
      // Colored tiles
      if(p.tiles)p.tiles.forEach((tl,ti)=>{ctx.fillStyle=`hsl(${ti*45},90%,55%)88`;ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.beginPath();const s=Math.min(p.w,p.h)*.25;ctx.moveTo(p.x+tl.x,p.y+tl.y-s);ctx.lineTo(p.x+tl.x+s,p.y+tl.y);ctx.lineTo(p.x+tl.x,p.y+tl.y+s);ctx.lineTo(p.x+tl.x-s,p.y+tl.y);ctx.closePath();ctx.fill();ctx.stroke()});
      ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.globalAlpha=1;ctx.strokeRect(p.x,p.y,p.w,p.h)}
    else if(t==='mirror'){
      const mg=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y+p.h);mg.addColorStop(0,'rgba(180,192,210,0.95)');mg.addColorStop(.4,'rgba(220,230,245,0.98)');mg.addColorStop(.6,'rgba(200,210,230,0.95)');mg.addColorStop(1,'rgba(160,175,200,0.9)');ctx.fillStyle=mg;ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h);
      // Shimmer
      const sh=(p.shine+frame*.5)%360;ctx.fillStyle=`hsla(${sh},100%,95%,0.15)`;ctx.fillRect(p.x+p.w*.1,p.y+p.h*.05,p.w*.08,p.h*.7);
      ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(p.x,p.y,p.w,p.h*.5)}
    else if(t==='frosted'){
      ctx.fillStyle='rgba(200,220,240,0.55)';ctx.fillRect(p.x,p.y,p.w,p.h);
      if(p.noise)p.noise.forEach(n=>{const ng=ctx.createRadialGradient(p.x+n.x,p.y+n.y,0,p.x+n.x,p.y+n.y,n.r);ng.addColorStop(0,'rgba(255,255,255,0.15)');ng.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=ng;ctx.beginPath();ctx.arc(p.x+n.x,p.y+n.y,n.r,0,Math.PI*2);ctx.fill()});
      ctx.strokeStyle='rgba(180,200,220,0.6)';ctx.lineWidth=1.5;ctx.strokeRect(p.x,p.y,p.w,p.h)}
    else if(t==='gothic'){
      ctx.fillStyle=p.col+'44';ctx.strokeStyle=p.col;ctx.lineWidth=2.5;ctx.shadowColor=p.col;ctx.shadowBlur=18;
      ctx.beginPath();ctx.moveTo(p.x,p.y+p.h);ctx.lineTo(p.x,p.y+p.h*.4);ctx.bezierCurveTo(p.x,p.y,p.x+p.w/2,p.y-p.h*.12,p.x+p.w/2,p.y-p.h*.12);ctx.bezierCurveTo(p.x+p.w/2,p.y-p.h*.12,p.x+p.w,p.y,p.x+p.w,p.y+p.h*.4);ctx.lineTo(p.x+p.w,p.y+p.h);ctx.closePath();ctx.fill();ctx.stroke();
      // Inner tracery
      ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h*.3,p.w*.2,0,Math.PI*2);ctx.stroke()}
    else if(t==='mosaic'){
      ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.rotate(p.rot||0);
      ctx.fillStyle=p.col+'88';ctx.strokeStyle=p.col;ctx.lineWidth=2.5;ctx.shadowColor=p.col;ctx.shadowBlur=15;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.globalAlpha=.25;ctx.fillStyle='#fff';ctx.fillRect(-p.w/2+4,-p.h/2+4,6,p.h*.4);ctx.restore()}
    ctx.restore()})}

function glassClick(x,y){
  gPanels.forEach(p=>{
    if(p.broken)return;
    let hit=false;
    if(p.type==='gothic'){// point-in-arch check (simplified bounding)
      hit=x>p.x&&x<p.x+p.w&&y>p.y-p.h*.12&&y<p.y+p.h}
    else if(p.type==='mosaic'){
      const dx2=x-(p.x+p.w/2),dy2=y-(p.y+p.h/2);hit=Math.abs(dx2)<p.w/2&&Math.abs(dy2)<p.h/2}
    else{hit=x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h}
    if(hit){
      p.broken=true;playGlass();
      const n=p.type==='stained'?50:p.type==='mosaic'?20:p.type==='mirror'?35:40;
      for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*8+2,sz=p.type==='mirror'?Math.random()*12+4:Math.random()*8+3;
        addP(p.x+Math.random()*p.w,p.y+Math.random()*p.h,Math.cos(a)*sp,Math.sin(a)*sp-3,p.type==='mirror'?'#c8d8e8':p.col+'cc',130,sz,.3)}}})}

function addGlassExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  GTYPES.forEach(t=>{const b=document.createElement('button');b.className='xb';b.textContent=t.charAt(0).toUpperCase()+t.slice(1);b.style.color=glassType===t?'#0ff':'rgba(255,255,255,0.4)';b.style.borderColor=glassType===t?'#0ff88':'rgba(255,255,255,0.15)';b.onclick=()=>{glassType=t;initGlass()};row.appendChild(b)})}

// ══════════ LIQUID ════════════════════════════════════════════════════════
let bottles=[],liqSel=0;
const LL=[{n:'Nebula',c:'#9b59b6'},{n:'Aurora',c:'#1abc9c'},{n:'Plasma',c:'#e74c3c'},{n:'Solar',c:'#f39c12'},{n:'Cosmic',c:'#3498db'},{n:'Void',c:'#2c3e50'}];
function initLiquid(){bottles=[];for(let i=0;i<4;i++)bottles.push({x:W*(i+.5)/4,y:H/2,w:70,h:200,level:.1+Math.random()*.4,col:LL[i%LL.length].c,filling:false,bubbles:[],glow:0})}
function drawBottle(b){const bx=b.x,by=b.y,bw=b.w,bh=b.h;ctx.save();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(bx-bw*.3,by-bh/2-20);ctx.lineTo(bx+bw*.3,by-bh/2-20);ctx.lineTo(bx+bw*.45,by-bh/2);ctx.lineTo(bx+bw/2,by-bh/2+20);ctx.lineTo(bx+bw/2,by+bh/2);ctx.lineTo(bx-bw/2,by+bh/2);ctx.lineTo(bx-bw/2,by-bh/2+20);ctx.lineTo(bx-bw*.45,by-bh/2);ctx.closePath();ctx.stroke();ctx.shadowBlur=0;
  const fh=bh*b.level,lt=by+bh/2-fh,wy=lt+Math.sin(frame*.08+b.x)*6;ctx.beginPath();ctx.moveTo(bx-bw/2,by+bh/2);ctx.lineTo(bx+bw/2,by+bh/2);ctx.lineTo(bx+bw/2,wy);for(let wx=bx+bw/2;wx>=bx-bw/2;wx-=5)ctx.lineTo(wx,wy+Math.sin((wx-bx)*.15+frame*.1)*4);ctx.closePath();
  const lg=ctx.createLinearGradient(bx-bw/2,lt,bx+bw/2,by+bh/2);lg.addColorStop(0,b.col+'cc');lg.addColorStop(1,b.col+'ff');ctx.fillStyle=lg;ctx.shadowColor=b.col;ctx.shadowBlur=b.glow*20;ctx.globalAlpha=.85;ctx.fill();
  b.bubbles.forEach((bub,j)=>{bub.y-=bub.sp;bub.x+=Math.sin(bub.y*.05)*.5;bub.life--;ctx.beginPath();ctx.arc(bub.x,bub.y,bub.r,0,Math.PI*2);ctx.strokeStyle=b.col+'aa';ctx.lineWidth=1;ctx.globalAlpha=bub.life/40;ctx.stroke();if(bub.life<=0||bub.y<lt)b.bubbles.splice(j,1)});
  ctx.restore();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px Courier New';ctx.textAlign='center';ctx.fillText(LL[liqSel].n,bx,by+bh/2+20);b.glow*=.92}
function tickLiquid(){bottles.forEach(b=>{if(b.filling&&b.level<.95){b.level+=.005;if(Math.random()<.1)b.bubbles.push({x:b.x+(Math.random()-.5)*b.w*.6,y:b.y+b.h/2-b.level*b.h+Math.random()*20,r:Math.random()*4+2,sp:Math.random()*1.5+.5,life:40})}b.filling=false})}
function liqClick(x,y){bottles.forEach(b=>{if(x>b.x-b.w/2&&x<b.x+b.w/2&&y>b.y-b.h/2&&y<b.y+b.h/2){b.col=LL[liqSel].c;b.filling=true;b.glow=1;if(Math.random()<.2)playBubble()}})}
function addLiqExtra(){const row=document.getElementById('extra');row.innerHTML='';LL.forEach((l,i)=>{const b=document.createElement('button');b.className='xb';b.textContent=l.n;b.style.borderColor=l.c+'88';b.style.color=liqSel===i?l.c:'rgba(255,255,255,0.4)';b.onclick=()=>{liqSel=i;addLiqExtra()};row.appendChild(b)})}

// ══════════ ASTEROIDS ═════════════════════════════════════════════════════
let asteroids=[];
function initAsteroid(){asteroids=[];for(let i=0;i<12;i++)spawnAst()}
function spawnAst(){const r=Math.random()*40+20,sides=Math.floor(Math.random()*4+6),pts=[];for(let i=0;i<sides;i++){const a=i/sides*Math.PI*2,rr=r*(.7+Math.random()*.6);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}asteroids.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,rot:Math.random()*360,rs:(Math.random()-.5)*2,r,pts,col:'#'+Math.floor(Math.random()*0xaaaaaa+0x555555).toString(16).padStart(6,'0'),alive:true})}
function drawAsteroids(){asteroids.forEach(a=>{if(!a.alive)return;a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;a.rot+=a.rs;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot*Math.PI/180);ctx.strokeStyle=a.col;ctx.lineWidth=2;ctx.shadowColor=a.col;ctx.shadowBlur=8;ctx.fillStyle=a.col+'33';ctx.beginPath();a.pts.forEach(([px,py],i)=>i===0?ctx.moveTo(px,py):ctx.lineTo(px,py));ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()})}
function astClick(x,y){asteroids.forEach(a=>{if(!a.alive)return;if(Math.hypot(x-a.x,y-a.y)<a.r+15){a.alive=false;playBoom();for(let i=0;i<25;i++){const ang=Math.random()*Math.PI*2,sp=Math.random()*10+3;addP(a.x,a.y,Math.cos(ang)*sp,Math.sin(ang)*sp,a.col,100,Math.random()*6+2,.2)};setTimeout(spawnAst,2000)}})}

// ══════════ VOLCANO ═══════════════════════════════════════════════════════
let volcs=[];
function initVolcano(){volcs=[{x:W*.3,y:H*.72,h:H*.36,charge:0},{x:W*.7,y:H*.72,h:H*.42,charge:0}]}
function trigVol(v){v.charge=1;playBoom();for(let i=0;i<60;i++){const a=-Math.PI/2+(Math.random()-.5)*1.2,sp=Math.random()*15+5,cl=['#ff4500','#ff6600','#ff8c00','#ffd700'][Math.floor(Math.random()*4)];addP(v.x,v.y-v.h*.9,Math.cos(a)*sp,Math.sin(a)*sp,cl,120,Math.random()*8+4,-.2)}}
function drawVolcs(){volcs.forEach(v=>{ctx.save();const g=ctx.createLinearGradient(v.x-v.h*.6,v.y,v.x,v.y-v.h);g.addColorStop(0,'#8b4513');g.addColorStop(.7,'#6b3410');g.addColorStop(1,'#4a2008');ctx.fillStyle=g;ctx.shadowColor=v.charge>.1?'#ff4500':'#8b4513';ctx.shadowBlur=v.charge>.1?30:10;ctx.beginPath();ctx.moveTo(v.x-v.h*.6,v.y);ctx.lineTo(v.x,v.y-v.h);ctx.lineTo(v.x+v.h*.6,v.y);ctx.closePath();ctx.fill();ctx.fillStyle=v.charge>.3?'#ff4500':'#2c1008';ctx.shadowBlur=v.charge>.1?40:5;ctx.beginPath();ctx.ellipse(v.x,v.y-v.h*.92,v.h*.12,v.h*.06,0,0,Math.PI*2);ctx.fill();v.charge*=.96;ctx.restore()})}
function volcClick(x,y){volcs.forEach(v=>{if(Math.hypot(x-v.x,y-v.y+v.h*.5)<v.h*.6)trigVol(v)})}

// ══════════ SPRINKLER ═════════════════════════════════════════════════════
let sprinks=[];const SCOLS=['#00d4d4','#a855f7','#f0a832','#e04f8a','#4fc3f7','#00ff88'];
function initSprinkler(){sprinks=[{x:W/2,y:H*.3,ang:0,col:SCOLS[0],ci:0}]}
function tickSprinks(){sprinks.forEach(s=>{s.ang+=3;if(frame%3===0){const a=s.ang*Math.PI/180+(Math.random()-.5)*.5,sp=Math.random()*10+5;addP(s.x,s.y,Math.cos(a)*sp,Math.sin(a)*sp-2,s.col,90,Math.random()*4+2,.3);addP(s.x,s.y,Math.cos(a+Math.PI)*sp,Math.sin(a+Math.PI)*sp-2,SCOLS[(s.ci+3)%SCOLS.length],90,Math.random()*4+2,.3);if(frame%12===0)playBubble()}})}
function drawSprinks(){sprinks.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.strokeStyle=s.col;ctx.lineWidth=8;ctx.lineCap='round';ctx.shadowColor=s.col;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke();ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.restore()})}
function sprinkClick(x,y){sprinks.push({x,y,ang:Math.random()*360,col:SCOLS[Math.floor(Math.random()*SCOLS.length)],ci:Math.floor(Math.random()*SCOLS.length)})}

// ══════════ SODA ══════════════════════════════════════════════════════════
let soda={x:0,y:0,shake:0,phase:0,exploded:false,bubbles:[],col:'#00d4d4'};
function initSoda(){soda={x:W/2,y:H*.55,shake:0,phase:0,exploded:false,bubbles:[],col:'#00d4d4'};document.getElementById('extra').innerHTML='<button class="xb" onclick="shakeSoda()" style="color:#00d4d4;border-color:#00d4d488">SHAKE</button><button class="xb" onclick="soda.col=\'#ff0066\'" style="color:#ff0066">PLASMA</button><button class="xb" onclick="soda.col=\'#ffd700\'" style="color:#ffd700">SOLAR</button>'}
function shakeSoda(){if(soda.exploded)return;soda.shake+=.3;soda.phase++;playBubble();if(soda.phase>=5){soda.exploded=true;playBoom();const cl=['#00d4d4','#ff0066','#ffd700','#00ff88','#a855f7'];for(let i=0;i<120;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*18+5;addP(soda.x,soda.y-60,Math.cos(a)*sp,Math.sin(a)*sp-8,cl[Math.floor(Math.random()*5)],140,Math.random()*6+2,.25)};setTimeout(()=>{initSoda()},3000)}}

  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(-bw*.4,-bh*.15,bw*.8,bh*.3);
  if(Math.random()<.15)s.bubbles.push({x:(Math.random()-.5)*bw*.6,y:bh*.3,r:Math.random()*4+1,sp:Math.random()*2+1,life:60});
  s.bubbles.forEach((b,i)=>{b.y-=b.sp;b.life--;if(b.life<=0)s.bubbles.splice(i,1);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke()});
  const pct=s.phase/5;ctx.fillStyle=`hsl(${120-pct*120},100%,50%)`;ctx.fillRect(-bw*.4,bh*.35-pct*20,bw*.8*pct,10);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(-bw*.25,-bh/2-15,bw*.5,15);ctx.fillRect(-bw*.12,-bh/2-22,bw*.24,10);
  ctx.restore();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px Courier New';ctx.textAlign='center';ctx.fillText(['MINT SODA','SHAKING..','PRESSURE!','DANGER!!','EXPLODE!!'][Math.min(s.phase,4)],s.x,s.y+bh*.5+20)}

function bmSound(track,vol){
  const a=getAudio(),t=a.currentTime,g=a.createGain();
  g.gain.setValueAtTime(vol,t);
  const c=a._comp||a.destination;
  if(track==='KICK'){
    g.gain.exponentialRampToValueAtTime(0.001,t+0.45);g.connect(c);
    const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.2);o.connect(g);o.start(t);o.stop(t+0.5);
    const o2=a.createOscillator();o2.type='square';o2.frequency.setValueAtTime(80,t);o2.frequency.exponentialRampToValueAtTime(30,t+0.05);const g2=a.createGain();g2.gain.setValueAtTime(vol*.3,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.06);o2.connect(g2);g2.connect(c);o2.start(t);o2.stop(t+0.07);
  }else if(track==='SNARE'){
    g.gain.exponentialRampToValueAtTime(0.001,t+0.18);g.connect(c);
    const buf=a.createBuffer(1,a.sampleRate*.18,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
    const src=a.createBufferSource();src.buffer=buf;src.connect(g);src.start(t);
    const o=a.createOscillator();o.type='triangle';o.frequency.value=200;const hg=a.createGain();hg.gain.setValueAtTime(vol*.4,t);hg.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.connect(hg);hg.connect(c);o.start(t);o.stop(t+0.12);
  }else if(track==='HI-HAT'){
    g.gain.exponentialRampToValueAtTime(0.001,t+0.08);g.connect(c);
    const buf=a.createBuffer(1,a.sampleRate*.08,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=a.createBufferSource();const flt=a.createBiquadFilter();flt.type='highpass';flt.frequency.value=8000;src.buffer=buf;src.connect(flt);flt.connect(g);src.start(t);
  }else if(track==='CLAP'){
    for(let i=0;i<3;i++){const tt=t+i*.012;const gg=a.createGain();gg.gain.setValueAtTime(vol*.7,tt);gg.gain.exponentialRampToValueAtTime(0.001,tt+0.12);gg.connect(c);
    const buf=a.createBuffer(1,a.sampleRate*.1,a.sampleRate);const d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);
    const src=a.createBufferSource();src.buffer=buf;const flt=a.createBiquadFilter();flt.type='bandpass';flt.frequency.value=1200;flt.Q.value=0.8;src.connect(flt);flt.connect(gg);src.start(tt)}
  }else if(track==='BASS'){
    g.gain.exponentialRampToValueAtTime(0.001,t+0.35);g.connect(c);
    const o=a.createOscillator();o.type='sawtooth';o.frequency.value=60+Math.random()*20;
    const flt=a.createBiquadFilter();flt.type='lowpass';flt.frequency.value=400;o.connect(flt);flt.connect(g);o.start(t);o.stop(t+0.38);
  }else if(track==='LEAD'){
    g.gain.exponentialRampToValueAtTime(0.001,t+0.25);g.connect(a._rev||c);
    const freqs=[261.63,293.66,329.63,369.99,392,440,493.88,523.25];
    const f=freqs[Math.floor(Math.random()*freqs.length)];
    const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const o2=a.createOscillator();o2.type='square';o2.frequency.value=f*1.005;const og=a.createGain();og.gain.value=0.4;
    o.connect(g);o2.connect(og);og.connect(g);o.start(t);o2.start(t);o.stop(t+0.28);o2.stop(t+0.28);
  }else if(track==='PAD'){
    g.gain.linearRampToValueAtTime(vol*.5,t+0.1);g.gain.exponentialRampToValueAtTime(0.001,t+1.2);g.connect(a._rev||c);
    [1,1.5,2,2.5].forEach((mult,i)=>{const o=a.createOscillator();o.type='sine';o.frequency.value=110*mult;const hg=a.createGain();hg.gain.value=1-i*.2;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+1.3)});
  }else{
    g.gain.exponentialRampToValueAtTime(0.001,t+0.3);g.connect(c);
    const f=200+Math.random()*2000;const o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.3,t+0.2);o.connect(g);o.start(t);o.stop(t+0.32);
  }
}

let instrType='piano',instrOct=4;
const INSTR_LIST=['Piano','Guitar','Violin','Bass','Synth Lead','Synth Pad','Organ','Flute'];
const KEY_NOTES=[{note:'C',semi:0,black:false},{note:'C#',semi:1,black:true},{note:'D',semi:2,black:false},{note:'D#',semi:3,black:true},{note:'E',semi:4,black:false},{note:'F',semi:5,black:false},{note:'F#',semi:6,black:true},{note:'G',semi:7,black:false},{note:'G#',semi:8,black:true},{note:'A',semi:9,black:false},{note:'A#',semi:10,black:true},{note:'B',semi:11,black:false}];
const KB_MAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11};
function noteFreq(semi,oct){return 261.63*Math.pow(2,(semi+(oct-4)*12)/12)}
function playInstr(semi){
  const f=noteFreq(semi,instrOct);const a=getAudioH(),t=a.currentTime,g=a.createGain();const c=a._comp;const it=instrType;
  if(it==='piano'){
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.4,t+0.008);g.gain.exponentialRampToValueAtTime(0.001,t+2.0);g.connect(a._rev);g.connect(c);
    [[1,1],[2,0.5],[3,0.25],[4,0.12],[6,0.06]].forEach(([h,w])=>{const o=a.createOscillator();o.type='sine';o.frequency.value=f*h;const hg=a.createGain();hg.gain.value=w;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+2.1)});
  }else if(it==='guitar'){
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.4);g.connect(a._rev);g.connect(c);
    [[1,0.4],[2,0.24],[3,0.12],[4,0.06],[5,0.032]].forEach(([h,w])=>{const o=a.createOscillator();o.type=h%2===0?'square':'sawtooth';o.frequency.value=f*h;const hg=a.createGain();hg.gain.value=w;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+1.5)});
    const noise=a.createBuffer(1,a.sampleRate*.04,a.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
    const ns=a.createBufferSource();ns.buffer=noise;const ng=a.createGain();ng.gain.value=0.08;ns.connect(ng);ng.connect(c);ns.start(t);
  }else if(it==='violin'){
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.35,t+0.15);g.gain.exponentialRampToValueAtTime(0.001,t+1.8);g.connect(a._rev);g.connect(c);
    const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const flt=a.createBiquadFilter();flt.type='bandpass';flt.frequency.value=f*3;flt.Q.value=2;o.connect(flt);flt.connect(g);o.start(t);o.stop(t+1.9);
    const vib=a.createOscillator();const vibG=a.createGain();vib.frequency.value=6;vibG.gain.value=f*0.015;vib.connect(vibG);vibG.connect(o.frequency);vib.start(t+0.2);vib.stop(t+1.9);
  }else if(it==='bass'){
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.5,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+0.8);g.connect(c);
    const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f/2;
    const flt=a.createBiquadFilter();flt.type='lowpass';flt.frequency.value=600;flt.Q.value=1.5;o.connect(flt);flt.connect(g);o.start(t);o.stop(t+0.9);
    const o2=a.createOscillator();o2.type='square';o2.frequency.value=f/2*1.002;const g2=a.createGain();g2.gain.value=0.3;o2.connect(g2);g2.connect(g);o2.start(t);o2.stop(t+0.9);
  }else if(it==='synth lead'){
    g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);g.connect(a._rev);g.connect(c);
    const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;const o2=a.createOscillator();o2.type='square';o2.frequency.value=f*1.008;
    const og=a.createGain();og.gain.value=0.5;const flt=a.createBiquadFilter();flt.type='lowpass';flt.frequency.setValueAtTime(3000,t);flt.frequency.exponentialRampToValueAtTime(800,t+0.5);
    o.connect(flt);o2.connect(og);og.connect(flt);flt.connect(g);o.start(t);o2.start(t);o.stop(t+0.55);o2.stop(t+0.55);
  }else if(it==='synth pad'){
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.25,t+0.3);g.gain.exponentialRampToValueAtTime(0.001,t+2.5);g.connect(a._rev);g.connect(c);
    [1,1.5,2,2.5,3].forEach((m,i)=>{const o=a.createOscillator();o.type='sine';o.frequency.value=f*m*(1+i*.002);const hg=a.createGain();hg.gain.value=1-i*.18;o.connect(hg);hg.connect(g);o.start(t);o.stop(t+2.6)});
  }else if(it==='organ'){
    g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.2);g.connect(c);
    [1,2,4,8].forEach((h,i)=>{const o=a.createOscillator();o.type='sine';o.frequency.value=f*h;const hg=a.createGain();hg.gain.value=[1,0.8,0.4,0.2][i];o.connect(hg);hg.connect(g);o.start(t);o.stop(t+1.3)});
  }else{
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+0.1);g.gain.exponentialRampToValueAtTime(0.001,t+1.5);g.connect(a._rev);g.connect(c);
    const o=a.createOscillator();o.type='sine';o.frequency.value=f*2;o.connect(g);o.start(t);o.stop(t+1.6);
    const vib2=a.createOscillator();const vg2=a.createGain();vib2.frequency.value=5;vg2.gain.value=f*.01;vib2.connect(vg2);vg2.connect(o.frequency);vib2.start(t+0.2);vib2.stop(t+1.6);
  }
}

// ── Mixer ─────────────────────────────────────────────────────────────────────
let mixer={loops:[
  {name:'Deep House',playing:false,vol:0.7,muted:false,src:null,gainNode:null,genre:'deephouse'},
  {name:'Techno',    playing:false,vol:0.7,muted:false,src:null,gainNode:null,genre:'techno'},
  {name:'Trance',    playing:false,vol:0.7,muted:false,src:null,gainNode:null,genre:'trance'},
  {name:'Synthwave', playing:false,vol:0.7,muted:false,src:null,gainNode:null,genre:'synthwave'},
]};
function mixerMakeLoop(genre){
  const a=getAudio();const sp=a.sampleRate;const bufLen=sp*2;
  const buf=a.createBuffer(2,bufLen,sp);const p=GENRE_PATTERNS[genre];const bpm=p?p.bpm:120;
  const stepLen=Math.floor((60/bpm/4)*sp);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);
    if(p){
      p.KICK.forEach((on,si)=>{if(!on)return;const st=si*stepLen;const len=Math.min(Math.floor(stepLen*.4),bufLen-st);for(let i=0;i<len;i++){const t=i/sp;d[st+i]=(d[st+i]||0)+0.6*Math.sin(2*Math.PI*80*t)*Math.exp(-t*12)}});
      p.SNARE.forEach((on,si)=>{if(!on)return;const st=si*stepLen;const len=Math.min(Math.floor(stepLen*.15),bufLen-st);for(let i=0;i<len;i++){d[st+i]=(d[st+i]||0)+0.3*(Math.random()*2-1)*Math.exp(-i/sp*20)}});
      const hh=p['HI-HAT']||[];hh.forEach((on,si)=>{if(!on)return;const st=si*stepLen;const len=Math.min(Math.floor(stepLen*.08),bufLen-st);for(let i=0;i<len;i++){d[st+i]=(d[st+i]||0)+0.15*(Math.random()*2-1)*Math.exp(-i/sp*60)}});
      p.BASS.forEach((on,si)=>{if(!on)return;const st=si*stepLen;const bf=80+si*5;const len=Math.min(Math.floor(stepLen*.35),bufLen-st);for(let i=0;i<len;i++){const t=i/sp;d[st+i]=(d[st+i]||0)+0.4*((2*(t*bf%1))-1)*Math.exp(-t*8)}});
    }
  }
  return buf;
}
function mixerToggle(idx){
  const lp=mixer.loops[idx];const a=getAudio();
  if(lp.playing){try{lp.src.stop()}catch(e){}lp.src=null;lp.playing=false;}
  else{
    const buf=mixerMakeLoop(lp.genre);const src=a.createBufferSource();src.buffer=buf;src.loop=true;
    const gain=a.createGain();gain.gain.value=lp.muted?0:lp.vol;
    const c=a._comp||a.destination;src.connect(gain);gain.connect(c);src.start();
    lp.src=src;lp.gainNode=gain;lp.playing=true;
  }
  renderMixer();
}
function mixerVol(idx,v){mixer.loops[idx].vol=+v;if(mixer.loops[idx].gainNode&&!mixer.loops[idx].muted)mixer.loops[idx].gainNode.gain.value=+v;renderMixer()}
function mixerMute(idx){const lp=mixer.loops[idx];lp.muted=!lp.muted;if(lp.gainNode)lp.gainNode.gain.value=lp.muted?0:lp.vol;renderMixer()}
function mixerStopAll(){mixer.loops.forEach((_,i)=>{if(mixer.loops[i].playing)mixerToggle(i)})}
function renderMixer(){
  const el=document.getElementById('mixerCh');if(!el)return;el.innerHTML='';
  mixer.loops.forEach((lp,i)=>{
    const col=['#ff6b6b','#00ccff','#cc44ff','#ff9944'][i];
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px;border:1px solid rgba(255,255,255,0.06);border-radius:2px;flex-wrap:wrap;';
    row.innerHTML='<div style="width:90px;font-size:10px;color:'+col+';letter-spacing:1px">'+lp.name+'</div>'+
      '<button onclick="mixerToggle('+i+')" style="background:'+(lp.playing?'rgba(0,255,136,0.15)':'none')+';border:1px solid '+(lp.playing?'#00ff88':'rgba(255,255,255,0.2)')+';color:'+(lp.playing?'#00ff88':'rgba(255,255,255,0.5)')+';padding:5px 12px;font-size:10px;cursor:pointer;font-family:\'Courier New\',monospace;">'+(lp.playing?'STOP':'PLAY')+'</button>'+
      '<input type="range" min="0" max="1" step="0.01" value="'+lp.vol+'" oninput="mixerVol('+i+',this.value)" style="width:80px;accent-color:'+col+'">'+
      '<button onclick="mixerMute('+i+')" style="background:'+(lp.muted?'rgba(255,68,68,0.15)':'none')+';border:1px solid '+(lp.muted?'#ff4444':'rgba(255,255,255,0.15)')+';color:'+(lp.muted?'#ff4444':'rgba(255,255,255,0.4)')+';padding:5px 10px;font-size:9px;cursor:pointer;font-family:\'Courier New\',monospace;">'+(lp.muted?'UNMUTE':'MUTE')+'</button>';
    el.appendChild(row);
  });
}

let fx={dist:{on:false,amount:50},filter:{on:false,type:'lowpass',cutoff:2000,q:1},delay:{on:false,time:0.3,feedback:0.4},reverb_extra:{on:false,amount:0.5}};
function fxGetFilter(){
  const a=getAudio();
  if(!a._fxFilt){a._fxFilt=a.createBiquadFilter();a._fxFilt.type='lowpass';a._fxFilt.frequency.value=20000;a._fxFilt.Q.value=1;
    if(a._comp){try{a._comp.disconnect()}catch(e){}a._comp.connect(a._fxFilt);a._fxFilt.connect(a.destination)}}
  return a._fxFilt;
}
function fxApply(){
  const flt=fxGetFilter();flt.type=fx.filter.type;flt.frequency.value=fx.filter.on?fx.filter.cutoff:20000;flt.Q.value=fx.filter.on?fx.filter.q:1;
  const a=getAudio();if(a._rev){const rv=a._revGain||(()=>{const rg=a.createGain();a._revGain=rg;a._rev.connect(rg);rg.connect(a.destination);return rg})();rv.gain.value=fx.reverb_extra.on?fx.reverb_extra.amount:.25}
}

// ══════════════════════════════════════════════════════════════════════════════
let mmStrokes=[],mmCurrent=[],mmReading='',mmReadTimer=0,mmDrawing=false;
const MM_READINGS={
  circular:['Cyclic thinker · you return to what matters','Wholeness seeker · completion drives you','The loop is your language — depth over breadth','You think in orbits · always coming back stronger'],
  angular:['Sharp mind · decisive under pressure','You cut through noise with precision','Angular energy = clarity of purpose · no wasted motion','Bold lines mean bold decisions · trust your instincts'],
  spiral:['Expanding consciousness · you evolve through repetition','Spiral = growth · each loop lands you higher','Your mind unfolds — patient, layered, infinite','You are a system in motion · trust the process'],
  chaotic:['Creative overload · too many signals at once','Chaotic = generative · this is raw creative energy','Breakthrough energy · chaos precedes transformation','You are restructuring · let the pattern emerge'],
  smooth:['Flow state active · you are in your element','Smooth = surrender · you trust the current','Ease is your superpower right now','Fluid mind · adaptable · nothing can hold you'],
  vertical:['Rising energy · upward momentum building','Vertical = ambition in motion · keep climbing','You are reaching · the top is closer than it feels','Ascension mode · root down to rise up'],
  horizontal:['Steady state · you are grounded and stable','Horizontal = endurance · you last when others stop','Calm power · stillness before the wave','You are measuring · patience is your weapon now'],
};
function analyzeStroke(pts){
  if(pts.length<5)return'smooth';
  let dx=0,dy=0,turns=0,totalLen=0;
  const dirs=[];
  for(let i=1;i<pts.length;i++){const ddx=pts[i].x-pts[i-1].x,ddy=pts[i].y-pts[i-1].y;totalLen+=Math.hypot(ddx,ddy);dirs.push(Math.atan2(ddy,ddx))}
  for(let i=1;i<dirs.length;i++){let diff=dirs[i]-dirs[i-1];while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;turns+=Math.abs(diff)}
  const start=pts[0],end=pts[pts.length-1];const closeDist=Math.hypot(end.x-start.x,end.y-start.y);
  const totalTurn=turns;
  if(closeDist<60&&totalLen>150)return'circular';
  if(totalTurn>Math.PI*4&&totalLen>200)return'spiral';
  if(totalTurn>Math.PI*2.5)return'chaotic';
  const avgDx=Math.abs(end.x-start.x),avgDy=Math.abs(end.y-start.y);
  if(avgDy>avgDx*2)return'vertical';
  if(avgDx>avgDy*2)return'horizontal';
  if(totalTurn<0.8)return'smooth';
  return'angular';
}
function mmGetReading(){
  if(!mmStrokes.length)return;
  const types=mmStrokes.map(s=>analyzeStroke(s));
  const counts={};types.forEach(t=>counts[t]=(counts[t]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  const pool=MM_READINGS[top];
  mmReading=pool[Math.floor(Math.random()*pool.length)];
  mmReadTimer=220;
  playNote(220+Math.random()*200,2,.15);
}
function initMindMirror(){mmStrokes=[];mmCurrent=[];mmReading='';mmReadTimer=0}
function mmDn(x,y){mmDrawing=true;mmCurrent=[{x,y}]}
function mmMv(x,y){if(!mmDrawing)return;mmCurrent.push({x,y})}
function mmUp(){if(mmCurrent.length>3){mmStrokes.push([...mmCurrent]);if(mmStrokes.length>=1)setTimeout(mmGetReading,400)}mmCurrent=[];mmDrawing=false}
function drawMindMirror(){
  // fade trail
  ctx.fillStyle='rgba(0,0,0,0.04)';ctx.fillRect(0,0,W,H);
  // draw all strokes
  mmStrokes.forEach((s,si)=>{
    if(s.length<2)return;
    const hue=(si*47)%360;
    ctx.save();ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=`hsla(${hue},100%,65%,0.7)`;ctx.shadowColor=`hsl(${hue},100%,60%)`;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke();ctx.restore();
  });
  // current stroke
  if(mmCurrent.length>1){
    ctx.save();ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='rgba(0,255,136,0.9)';ctx.shadowColor='#00ff88';ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(mmCurrent[0].x,mmCurrent[0].y);for(let i=1;i<mmCurrent.length;i++)ctx.lineTo(mmCurrent[i].x,mmCurrent[i].y);ctx.stroke();ctx.restore();
  }
  // reading display
  if(mmReading&&mmReadTimer>0){
    mmReadTimer--;
    const alpha=Math.min(1,mmReadTimer/20);
    ctx.save();ctx.textAlign='center';ctx.font='bold 15px Courier New';
    ctx.fillStyle=`rgba(0,255,136,${alpha})`;ctx.shadowColor='#00ff88';ctx.shadowBlur=20;
    ctx.fillText(mmReading,W/2,H-40);ctx.restore();
  }
  // instructions
  if(!mmStrokes.length){
    ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='12px Courier New';
    ctx.fillText('DRAW ANYTHING · YOUR STROKES WILL BE READ',W/2,H/2);ctx.restore();
  }
}

// CHAOS ENGINE — Lorenz / Rössler attractors + mouse energy
// ══════════════════════════════════════════════════════════════════════════════
let chaosType='lorenz',chaosX=0.1,chaosY=0,chaosZ=0,chaosTrail=[],chaosEnergy=1;
const CHAOS_PARAMS={
  lorenz: {sigma:10,rho:28,beta:2.667,dt:0.004,scale:6,cx:0,cy:0,col:'#00ffcc'},
  rossler:{a:0.2, b:0.2, c:5.7,     dt:0.02, scale:14,cx:0,cy:0,col:'#ff44aa'},
  thomas: {b:0.19,               dt:0.04, scale:22,cx:0,cy:0,col:'#ffaa00'},
  halvorsen:{a:1.4,              dt:0.008,scale:9, cx:0,cy:0,col:'#aa44ff'},
};
let mouseDx=0,mouseDy=0,lastMX=0,lastMY=0;
function initChaosEngine(){
  chaosX=0.1+Math.random()*.5;chaosY=Math.random()*.5;chaosZ=Math.random()*.5;
  chaosTrail=[];chaosEnergy=1;
  renderChaosExtra();
}
function renderChaosExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  Object.entries(CHAOS_PARAMS).forEach(([k,v])=>{
    const b=document.createElement('button');b.className='xb';b.textContent=k.toUpperCase();
    b.style.color=chaosType===k?v.col:'rgba(255,255,255,0.4)';b.style.borderColor=v.col+'55';
    b.onclick=()=>{chaosType=k;chaosX=0.1;chaosY=0;chaosZ=0;chaosTrail=[];renderChaosExtra()};
    row.appendChild(b);
  });
}
function drawChaosEngine(){
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,H);
  // Update mouse energy
  mouseDx=mx-lastMX;mouseDy=my-lastMY;lastMX=mx;lastMY=my;
  const mouseSpeed=Math.hypot(mouseDx,mouseDy);
  chaosEnergy=chaosEnergy*.95+mouseSpeed*.005;chaosEnergy=Math.max(0.5,Math.min(3,chaosEnergy));
  const p=CHAOS_PARAMS[chaosType];
  // Iterate attractor
  for(let i=0;i<6;i++){
    let nx=chaosX,ny=chaosY,nz=chaosZ;
    const dt=p.dt*chaosEnergy;
    if(chaosType==='lorenz'){
      nx+=p.sigma*(chaosY-chaosX)*dt;ny+=(chaosX*(p.rho-chaosZ)-chaosY)*dt;nz+=(chaosX*chaosY-p.beta*chaosZ)*dt;
    }else if(chaosType==='rossler'){
      nx+=(-chaosY-chaosZ)*dt;ny+=(chaosX+p.a*chaosY)*dt;nz+=(p.b+chaosZ*(chaosX-p.c))*dt;
    }else if(chaosType==='thomas'){
      nx+=(Math.sin(chaosY)-p.b*chaosX)*dt;ny+=(Math.sin(chaosZ)-p.b*chaosY)*dt;nz+=(Math.sin(chaosX)-p.b*chaosZ)*dt;
    }else{
      nx+=(-p.a*(chaosY+chaosZ)+Math.sin(chaosY))*dt;ny+=(-p.a*(chaosX+chaosZ)+Math.sin(chaosZ))*dt;nz+=(-p.a*(chaosX+chaosY)+Math.sin(chaosX))*dt;
    }
    chaosX=nx;chaosY=ny;chaosZ=nz;
    const sx=W/2+chaosX*p.scale,sy=H/2+chaosY*p.scale;
    chaosTrail.push({x:sx,y:sy,e:chaosEnergy});
  }
  if(chaosTrail.length>1800)chaosTrail.splice(0,chaosTrail.length-1800);
  // Draw trail
  if(chaosTrail.length>2){
    ctx.save();ctx.lineWidth=1;ctx.lineCap='round';
    for(let i=1;i<chaosTrail.length;i++){
      const a=i/chaosTrail.length;const pt=chaosTrail[i];
      ctx.strokeStyle=p.col+Math.floor(a*180).toString(16).padStart(2,'0');
      ctx.shadowColor=p.col;ctx.shadowBlur=pt.e*3;
      ctx.beginPath();ctx.moveTo(chaosTrail[i-1].x,chaosTrail[i-1].y);ctx.lineTo(pt.x,pt.y);ctx.stroke();
    }ctx.restore();
  }
  // Energy label
  ctx.save();ctx.font='10px Courier New';ctx.fillStyle='rgba(255,255,255,0.3)';ctx.textAlign='right';
  ctx.fillText(`ENERGY: ${chaosEnergy.toFixed(2)} · MOVE MOUSE`,W-10,H-10);ctx.restore();
}

// CRYSTAL LAB — procedural crystal growth
// ══════════════════════════════════════════════════════════════════════════════
let crystals=[],crystalGrowing=null,crystalAge=0;
const CRYSTAL_COLS=['#00ffcc','#aa44ff','#ff44cc','#ffdd00','#44aaff','#ff6644'];
function initCrystalLab(){crystals=[];crystalGrowing=null;crystalAge=0}
function crystalGrow(x,y){
  const col=CRYSTAL_COLS[Math.floor(Math.random()*CRYSTAL_COLS.length)];
  const arms=4+Math.floor(Math.random()*5);const len=40+Math.random()*80;
  const c={x,y,arms,len,col,age:0,maxAge:120,branches:[]};
  for(let a=0;a<arms;a++){
    const ang=a/arms*Math.PI*2+Math.random()*.3;
    const sub=2+Math.floor(Math.random()*4);
    for(let b=0;b<sub;b++){
      const t=0.3+b/sub*.6;c.branches.push({ang:ang+(Math.random()-.5)*.8,t,len:len*(0.3+Math.random()*.4),main:b===0});
    }
  }
  crystals.push(c);playNote(300+Math.random()*600,.8,.12);
}
function drawCrystalLab(){
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(0,0,W,H);
  crystalAge++;
  crystals.forEach(c=>{
    if(c.age<c.maxAge)c.age++;
    const prog=c.age/c.maxAge;
    if(!isFinite(c.x)||!isFinite(c.y)||!isFinite(prog)||prog<=0){ctx.save();ctx.restore();return;}
    ctx.save();ctx.translate(c.x,c.y);
    // Coreconst cg=ctx.createRadialGradient(0,0,0,0,0,Math.max(0.1,8*prog));
    cg.addColorStop(0,'rgba(255,255,255,0.9)');cg.addColorStop(1,c.col+'44');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,8*prog,0,Math.PI*2);ctx.fill();
    // Branches
    c.branches.forEach(b=>{
      const bProg=Math.max(0,Math.min(1,(prog-b.t*.3)/(1-b.t*.3)));
      if(bProg<=0)return;
      const ex=Math.cos(b.ang)*b.len*bProg,ey=Math.sin(b.ang)*b.len*bProg;
      ctx.strokeStyle=c.col+(b.main?'cc':'66');ctx.lineWidth=b.main?1.8:1;
      ctx.shadowColor=c.col;ctx.shadowBlur=b.main?10:4;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.stroke();
      // Tip facet
      if(bProg>.8){
        ctx.fillStyle=c.col+'88';ctx.beginPath();
        ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(b.ang+.4)*8,ey+Math.sin(b.ang+.4)*8);
        ctx.lineTo(ex+Math.cos(b.ang-.4)*8,ey+Math.sin(b.ang-.4)*8);ctx.closePath();ctx.fill();
      }
    });
    ctx.restore();
  });
  if(!crystals.length){
    ctx.save();ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='12px Courier New';
    ctx.fillText('CLICK ANYWHERE TO GROW CRYSTALS',W/2,H/2);ctx.restore();
  }
}

function srAnalyze(){
  srRecording=false;
  if(srTaps.length<3){srReading=SR_PROFILES[3];srReading={...SR_PROFILES[3],desc:"No taps detected · try again"};renderSRExtra();return}
  const intervals=[];for(let i=1;i<srTaps.length;i++)intervals.push(srTaps[i]-srTaps[i-1]);

  if(rtTapWindow&&rtTapTimer<=0){rtMisses++;rtTapWindow=false;}
  const p=RT_PATTERNS[rtPat];const cx=W/2,cy=H*.42;
  // Step display
  const sw=Math.min(W-40,520);const sh=44;const sx=(W-sw)/2;const sy=cy-sh/2;
  p.pattern.forEach((on,i)=>{
    const bx=sx+i*(sw/16),bw=sw/16-3;const active=rtPlaying&&i===rtStep;
    ctx.save();
    ctx.fillStyle=on?(active?'rgba(0,255,136,0.9)':'rgba(0,255,136,0.3)'):(active?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.06)');
    ctx.shadowColor=on?'#00ff88':'transparent';ctx.shadowBlur=active&&on?20:0;
    ctx.fillRect(bx,sy,bw,sh);
    if(i%4===0){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(bx,sy+sh,2,8)}
    ctx.restore();
  });
  // Flash
  if(rtFlash>0){rtFlash--;const a=rtFlash/8;ctx.save();ctx.globalAlpha=a*.15;ctx.fillStyle='#00ff88';ctx.fillRect(0,0,W,H);ctx.restore()}
  // Score
  ctx.save();ctx.textAlign='center';
  ctx.font=`bold ${Math.min(W*.08,36)}px Courier New`;ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';ctx.shadowBlur=rtPlaying?15:0;
  ctx.fillText(rtScore.toString().padStart(4,'0'),cx,cy-60);
  ctx.font='10px Courier New';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.shadowBlur=0;
  ctx.fillText(`HIT: ${rtHits}  MISS: ${rtMisses}`,cx,cy-40);
  ctx.font='12px Courier New';ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText(p.label+' · '+p.desc,cx,cy+70);
  if(rtPlaying){ctx.fillStyle='rgba(0,255,136,0.7)';ctx.font='11px Courier New';ctx.fillText('TAP CANVAS ON THE BEAT',cx,cy+92)}
  else{ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='11px Courier New';ctx.fillText('SELECT PATTERN · PRESS START',cx,cy+92)}
  ctx.restore();
}

// SOUND GEOMETRY — sacred geometry + tone resonance
// ══════════════════════════════════════════════════════════════════════════════
const SG_SHAPES={
  flower:    {n:6,  r:80,  overlap:true, col:'#ff44cc',label:'Flower of Life',  freq:528, desc:'The blueprint of creation'},
  metatron:  {n:13, r:70,  star:true,   col:'#ffdd00',label:"Metatron's Cube", freq:432, desc:'All Platonic solids contained'},
  sri_yantra:{n:9,  r:90,  yantra:true, col:'#00ccff',label:'Sri Yantra',       freq:396, desc:'The matrix of the cosmos'},
  fibonacci: {n:8,  r:0,   fib:true,    col:'#00ff88',label:'Fibonacci Spiral', freq:741, desc:'Nature\'s growth algorithm'},
  vesica:    {n:2,  r:80,  vesica:true, col:'#cc44ff',label:'Vesica Piscis',    freq:285, desc:'The womb of geometry'},
  torus:     {n:36, r:100, torus:true,  col:'#ff6644',label:'Torus Field',      freq:852, desc:'The shape of the universe'},
};
let sgShape='flower',sgRot=0,sgRinging=0;
function initSoundGeometry(){sgRot=0;sgRinging=0;renderSGExtra()}
function renderSGExtra(){
  const row=document.getElementById('extra');row.innerHTML='';
  Object.entries(SG_SHAPES).forEach(([k,v])=>{
    const b=document.createElement('button');b.className='xb';b.textContent=v.label.split(' ')[0];
    b.style.color=sgShape===k?v.col:'rgba(255,255,255,0.4)';b.style.borderColor=v.col+'55';
    b.onclick=()=>{sgShape=k;sgRinging=120;playNote(v.freq,3,.15);renderSGExtra()};row.appendChild(b);
  });
}
function drawSoundGeometry(){
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(0,0,W,H);
  const s=SG_SHAPES[sgShape];sgRot+=0.003;if(sgRinging>0)sgRinging--;
  const cx=W/2,cy=H/2,pulse=1+Math.sin(frame*.04)*.05+(sgRinging>0?Math.sin(frame*.15)*sgRinging/120*.3:0);
  const col=s.col;ctx.save();ctx.translate(cx,cy);
  if(s.overlap){// Flower of Life
    for(let i=0;i<7;i++){const a=i===0?0:((i-1)/6*Math.PI*2+sgRot);const ox=i===0?0:s.r*Math.cos(a),oy=i===0?0:s.r*Math.sin(a);
      ctx.strokeStyle=col+'55';ctx.lineWidth=1;ctx.shadowColor=col;ctx.shadowBlur=sgRinging>0?12:4;
      ctx.beginPath();ctx.arc(ox,oy,s.r*pulse,0,Math.PI*2);ctx.stroke();
    }
  }else if(s.star){// Metatron
    for(let i=0;i<13;i++){const a=i<7?(i===0?0:(i-1)/6*Math.PI*2):((i-7)/6*Math.PI*2)+Math.PI/6;
      const ox=i===0?0:(i<7?s.r:s.r*1.73)*Math.cos(a+sgRot),oy=i===0?0:(i<7?s.r:s.r*1.73)*Math.sin(a+sgRot);
      ctx.strokeStyle=col+'44';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(ox,oy,s.r*.57*pulse,0,Math.PI*2);ctx.stroke();
      if(i>0&&i<7)for(let j=i+1;j<7;j++){const a2=(j-1)/6*Math.PI*2;const ox2=s.r*Math.cos(a2+sgRot),oy2=s.r*Math.sin(a2+sgRot);
        ctx.strokeStyle=col+'33';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox2,oy2);ctx.stroke()}
    }
  }else if(s.fib){// Fibonacci spiral
    let a=0,b=1,x=0,y=0;for(let i=0;i<12;i++){const c=a+b;const r=b*8;
      ctx.strokeStyle=`hsla(${i*30},100%,60%,0.6)`;ctx.lineWidth=1;ctx.shadowColor=col;ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(x,y,r*pulse,sgRot+i*1.57,sgRot+(i+1)*1.57);ctx.stroke();
      const na=Math.cos(sgRot+i*1.57+1.57)*r,nb=Math.sin(sgRot+i*1.57+1.57)*r;x+=na;y+=nb;a=b;b=c;}
  }else if(s.vesica){// Vesica Piscis
    const off=s.r*.5*pulse;
    ctx.strokeStyle=col+'88';ctx.lineWidth=1.5;ctx.shadowColor=col;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(-off,0,s.r*pulse,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(off,0,s.r*pulse,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=col+'44';ctx.lineWidth=1;
    for(let r2=20;r2<s.r;r2+=20){ctx.beginPath();ctx.arc(0,0,r2*pulse,0,Math.PI*2);ctx.stroke()}
  }else if(s.torus){// Torus field
    for(let i=0;i<s.n;i++){const a=i/s.n*Math.PI*2+sgRot;const r2=s.r*(.3+.7*Math.abs(Math.cos(a)));
      const alpha=0.2+0.4*Math.abs(Math.cos(a));
      ctx.strokeStyle=col+Math.floor(alpha*255).toString(16).padStart(2,'0');ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(0,0,s.r*pulse,r2,a,0,Math.PI*2);ctx.stroke();}
  }else if(s.yantra){// Sri Yantra simplified
    for(let i=0;i<9;i++){const r2=s.r*(1-i*.08)*pulse;const pts=i%2===0?3:4;const off=i%2===0?0:Math.PI/pts;
      ctx.strokeStyle=col+Math.floor(80+i*18).toString(16);ctx.lineWidth=1;ctx.shadowColor=col;ctx.shadowBlur=i===0?15:0;
      ctx.beginPath();for(let j=0;j<=pts;j++){const a=j/pts*Math.PI*2+sgRot+off;j===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2)}ctx.closePath();ctx.stroke();
    }
  }
  ctx.restore();
  // Labels
  ctx.save();ctx.textAlign='center';ctx.font='bold 13px Courier New';ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;
  ctx.fillText(s.label,cx,cy+s.r*1.4+30);ctx.font='10px Courier New';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.shadowBlur=0;
  ctx.fillText(s.desc+' · '+s.freq+'Hz',cx,cy+s.r*1.4+50);ctx.restore();
}

// METEORITES (replaces Asteroids) — fiery rocky chunks
// ============================================================
let meteorites=[];
function initMeteorites(){
  meteorites=[];
  for(let i=0;i<10;i++)spawnMeteor();
}
function spawnMeteor(){
  const r=Math.random()*35+15;
  const sides=Math.floor(Math.random()*4+5);
  const pts=[];
  for(let i=0;i<sides;i++){const a=i/sides*Math.PI*2;pts.push([Math.cos(a)*r*(0.6+Math.random()*0.5),Math.sin(a)*r*(0.6+Math.random()*0.5)])}
  meteorites.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-0.5)*1.5,vy:(Math.random()-0.5)*1.5,
    rot:Math.random()*360,rs:(Math.random()-0.5)*1.2,
    r,pts,alive:true,
    trail:[],
    col:'#'+['8B4513','A0522D','CD853F','6B3A2A','7B5B3A'][Math.floor(Math.random()*5)],
    glowCol:'#ff6600',
    craters:[...Array(Math.floor(Math.random()*3+1))].map(()=>({x:(Math.random()-0.5)*r*.6,y:(Math.random()-0.5)*r*.6,r:r*.08+Math.random()*r*.12}))
  });
}
function playMeteorBoom(){
  const a=getAudio(),t=a.currentTime,g=a.createGain();
  g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
  g.connect(a._comp||a.destination);
  const buf=a.createBuffer(1,a.sampleRate*1,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);
  const src=a.createBufferSource();src.buffer=buf;
  const flt=a.createBiquadFilter();flt.type='lowpass';flt.frequency.value=180;
  src.connect(flt);flt.connect(g);src.start(t);
  const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(20,t+0.8);
  const g2=a.createGain();g2.gain.setValueAtTime(0.5,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.9);
  o.connect(g2);g2.connect(a._comp||a.destination);o.start(t);o.stop(t+1);
}
function drawMeteorites(){
  meteorites.forEach(m=>{
    if(!m.alive)return;
    m.x=(m.x+m.vx+W)%W;m.y=(m.y+m.vy+H)%H;m.rot+=m.rs;
    m.trail.unshift({x:m.x,y:m.y});if(m.trail.length>18)m.trail.pop();
    // Fire trail
    for(let i=1;i<m.trail.length;i++){
      const a=1-i/m.trail.length;
      const hue=30-i*2;
      ctx.save();ctx.globalAlpha=a*0.5;ctx.shadowColor='#ff6600';ctx.shadowBlur=8;
      ctx.fillStyle=`hsl(${hue},100%,55%)`;
      ctx.beginPath();ctx.arc(m.trail[i].x,m.trail[i].y,m.r*(1-i/m.trail.length)*0.6,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    // Body
    ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot*Math.PI/180);
    ctx.fillStyle=m.col;ctx.strokeStyle='#ff440044';ctx.lineWidth=1;
    ctx.shadowColor='#ff6600';ctx.shadowBlur=12;
    ctx.beginPath();m.pts.forEach(([px,py],i)=>i===0?ctx.moveTo(px,py):ctx.lineTo(px,py));ctx.closePath();ctx.fill();ctx.stroke();
    // Craters
    m.craters.forEach(c=>{ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(c.x,c.y,c.r,c.r*0.7,0.3,0,Math.PI*2);ctx.fill()});
    ctx.restore();
  });
}
function meteorClick(x,y){
  meteorites.forEach(m=>{
    if(!m.alive)return;
    if(Math.hypot(x-m.x,y-m.y)<m.r+12){
      m.alive=false;playMeteorBoom();
      for(let i=0;i<30;i++){const ang=Math.random()*Math.PI*2,sp=Math.random()*8+2;addP(m.x,m.y,Math.cos(ang)*sp,Math.sin(ang)*sp,m.col,90,Math.random()*5+2,0.2)}
      for(let i=0;i<15;i++){const ang=Math.random()*Math.PI*2,sp=Math.random()*6+3;addP(m.x,m.y,Math.cos(ang)*sp,Math.sin(ang)*sp,'#ff6600',60,Math.random()*4+1,0.15)}
      setTimeout(spawnMeteor,2500);
    }
  });
}

function initBalloons(){
  balloons=[];balloonScore=0;balloonCombo=0;balloonTimer=1800;
  for(let i=0;i<8;i++)spawnBalloon();
  const row=document.getElementById('extra');row.innerHTML='';
}
function spawnBalloon(){
  const col=BALLOON_COLS[Math.floor(Math.random()*BALLOON_COLS.length)];
  const r=22+Math.random()*22;
  balloons.push({
    x:80+Math.random()*(W-160),y:H+r+Math.random()*200,
    r,col,vx:(Math.random()-0.5)*0.8,vy:-(0.6+Math.random()*0.8),
    wobble:Math.random()*Math.PI*2,wobbleSpeed:0.04+Math.random()*0.03,
    alive:true,pop:0,str:['HI!','POP!','WOW!','YAY!',':)','!!!'][Math.floor(Math.random()*6)]
  });
}
function playBalloonPop(){
  const a=getAudio(),t=a.currentTime;
  const g=a.createGain();g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  g.connect(a._comp||a.destination);
  const buf=a.createBuffer(1,a.sampleRate*0.08,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*30);
  const src=a.createBufferSource();src.buffer=buf;
  const flt=a.createBiquadFilter();flt.type='bandpass';flt.frequency.value=800+Math.random()*400;flt.Q.value=2;
  src.connect(flt);flt.connect(g);src.start(t);
  // Squeak
  const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(1200+Math.random()*600,t);o.frequency.exponentialRampToValueAtTime(200,t+0.15);
  const g2=a.createGain();g2.gain.setValueAtTime(0.25,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  o.connect(g2);g2.connect(a._comp||a.destination);o.start(t);o.stop(t+0.18);
}
function drawBalloons(){
  if(balloonTimer>0){balloonTimer--}else{
    // Time up
    ctx.save();ctx.textAlign='center';
    ctx.font='bold 28px Courier New';ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=20;
    ctx.fillText('TIME UP! Score: '+balloonScore,W/2,H/2);
    if(balloonScore>balloonHigh)balloonHigh=balloonScore;
    ctx.font='14px Courier New';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.shadowBlur=0;
    ctx.fillText('Best: '+balloonHigh+'  |  Tap to play again',W/2,H/2+40);
    ctx.restore();return;
  }
  // Spawn more
  if(balloons.filter(b=>b.alive).length<6)spawnBalloon();
  balloons.forEach((b,bi)=>{
    if(!b.alive){
      // Pop burst
      if(b.pop>0){b.pop--;ctx.save();ctx.globalAlpha=b.pop/20;ctx.font='bold '+(22-b.pop/2)+'px Courier New';ctx.fillStyle='#ffdd00';ctx.textAlign='center';ctx.fillText(b.str,b.x,b.y);ctx.restore();}
      return;
    }
    b.wobble+=b.wobbleSpeed;b.x+=b.vx+Math.sin(b.wobble)*0.5;b.y+=b.vy;
    if(b.x<b.r||b.x>W-b.r)b.vx*=-1;
    if(b.y<-b.r*2){b.alive=false;spawnBalloon();}
    // Draw balloon
    ctx.save();ctx.translate(b.x,b.y);
    const g=ctx.createRadialGradient(-b.r*.3,-b.r*.3,b.r*.05,0,0,b.r);
    g.addColorStop(0,'rgba(255,255,255,0.5)');g.addColorStop(0.3,b.col+'ee');g.addColorStop(1,b.col+'88');
    ctx.fillStyle=g;ctx.shadowColor=b.col;ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(0,0,b.r,b.r*1.15,0,0,Math.PI*2);ctx.fill();
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.ellipse(-b.r*.25,-b.r*.3,b.r*.2,b.r*.12,-.4,0,Math.PI*2);ctx.fill();
    // Knot
    ctx.fillStyle=b.col;ctx.strokeStyle=b.col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(0,b.r*1.15,4,5,0,0,Math.PI*2);ctx.fill();
    // String
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,b.r*1.2);
    for(let sy=0;sy<60;sy+=5){ctx.lineTo(Math.sin(sy*.4+b.wobble)*4,b.r*1.2+sy)}ctx.stroke();
    ctx.restore();
  });
  // HUD
  ctx.save();ctx.font='bold 16px Courier New';ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=10;
  ctx.fillText('SCORE: '+balloonScore,12,32);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px Courier New';ctx.shadowBlur=0;
  ctx.fillText('BEST: '+balloonHigh,12,50);
  const pct=balloonTimer/1800;
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(W-160,14,140,10);
  ctx.fillStyle=pct>0.4?'#00ff88':pct>0.2?'#ffdd00':'#ff4444';ctx.fillRect(W-160,14,140*pct,10);
  ctx.restore();
}
function balloonClick(x,y){
  if(balloonTimer<=0){initBalloons();return;}
  let hit=false;
  balloons.forEach(b=>{
    if(!b.alive)return;
    if(Math.hypot(x-b.x,y-b.y)<b.r+8){
      b.alive=false;b.pop=20;hit=true;
      balloonCombo++;balloonScore+=balloonCombo;
      playBalloonPop();
      for(let i=0;i<20;i++){const ang=Math.random()*Math.PI*2,sp=Math.random()*7+2;addP(b.x,b.y,Math.cos(ang)*sp,Math.sin(ang)*sp,b.col,60,Math.random()*5+2,0.25)}
    }
  });
  if(!hit)balloonCombo=0;
}
